<!DOCTYPE html>
<html>
<head>
<title>Channel Importer</title>
</head>

<body>

<h2>SportzfyLive Channel Importer</h2>

<button onclick="upload()">Import Channels</button>

<pre id="result"></pre>


<script src="channels.js"></script>

<script>

async function upload(){

const result = document.getElementById("result");


try {

const response = await fetch(
"https://sportzfylive.svimranmy.workers.dev/api/import",
{
method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify(channels)

});


const data = await response.json();


result.textContent =
JSON.stringify(data,null,2);


}

catch(error){

result.textContent = error;

}

}

</script>

</body>
</html>
