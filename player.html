<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Player</title>
<style>
html,body{margin:0;height:100%;background:#000;color:#cbd5e1;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
video{display:block;width:100%;height:100%;background:#000}
.msg{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:24px;font-size:15px;line-height:1.5;background:#05060a}
.msg.show{display:flex}
</style>
</head>
<body>
<video id="video" controls autoplay playsinline></video>
<div class="msg" id="msg" role="status"></div>
<script>
// HLS player for .m3u8 streams on the Live TV page and the match watch view.
// It only plays the Worker's own /api/play redirects, so it cannot be pointed
// at arbitrary streams from another site.
(function () {
  "use strict";
  var HLS_SOURCES = [
    "https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.17/hls.min.js",
    "https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"
  ];
  var video = document.getElementById("video");
  var msg = document.getElementById("msg");
  var src = new URLSearchParams(location.search).get("src") || "";

  function fail(text) {
    msg.textContent = text;
    msg.classList.add("show");
  }
  function start() {
    var played = video.play();
    if (played && typeof played.catch === "function") played.catch(function () {});
  }

  if (!/^\/api\/play\/(tv\/[^/?#]+|stream\/[^/?#]+\/[^/?#]+)$/.test(src)) {
    fail("This stream is not available.");
    return;
  }
  var url = new URL(src, location.origin).href;

  // Safari and iOS play HLS natively.
  if (video.canPlayType("application/vnd.apple.mpegurl")) {
    video.src = url;
    video.addEventListener("error", function () { fail("The stream could not be loaded. Try again later or pick another stream."); });
    start();
    return;
  }

  function loadLibrary(index) {
    if (index >= HLS_SOURCES.length) {
      fail("The player could not be loaded. Check your connection and try again.");
      return;
    }
    var script = document.createElement("script");
    script.src = HLS_SOURCES[index];
    script.crossOrigin = "anonymous";
    script.onload = function () {
      if (!window.Hls || !window.Hls.isSupported()) {
        fail("This browser can't play this stream.");
        return;
      }
      var hls = new window.Hls({ enableWorker: true, lowLatencyMode: true });
      hls.on(window.Hls.Events.ERROR, function (_, data) {
        if (data && data.fatal) fail("The stream could not be loaded. Try again later or pick another stream.");
      });
      hls.on(window.Hls.Events.MANIFEST_PARSED, start);
      hls.loadSource(url);
      hls.attachMedia(video);
    };
    script.onerror = function () { loadLibrary(index + 1); };
    document.head.appendChild(script);
  }
  loadLibrary(0);
})();
</script>
</body>
</html>
