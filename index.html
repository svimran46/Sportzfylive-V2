<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sports Live TV</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg-primary: #09090B;
            --bg-surface: #131316;
            --border-default: #27272A;
            --text-primary: #FAFAFA;
            --text-muted: #A1A1AA;
            --brand-primary: #6366F1;
            --status-error: #EF4444;
            --accent-live: #EF4444;

            --space-1: 4px;
            --space-2: 8px;
            --space-3: 12px;
            --space-4: 16px;
            --space-6: 24px;
            --space-8: 32px;
            --space-12: 48px;

            --text-xs: 11px;
            --text-sm: 13px;
            --text-base: 15px;
            --text-lg: 18px;

            --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
            --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);
            --duration-fast: 150ms;
            --duration-normal: 250ms;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif;
        }

        html, body {
            width: 100%;
            overflow-x: hidden;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            font-size: var(--text-base);
            line-height: 1.5;
            padding-bottom: var(--space-12);
            -webkit-font-smoothing: antialiased;
        }

        /* =========================================
           PLAYER SECTION (always 16:9)
           ========================================= */
        .player-section {
            width: 100%;
            background: #000;
            position: relative;
            z-index: 100;
            box-shadow: 0 4px 20px rgba(0,0,0,0.8);
            transition: box-shadow 220ms ease, border-radius 220ms ease;
        }

        .player-wrapper {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            position: relative;
            aspect-ratio: 16 / 9;
            background: #000;
        }

        #videoPlayer, #iframePlayer {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: none;
            display: none;
            background: #000;
        }

        /* =========================================
           VIDEO LOADING INDICATOR — BALL LOADER ONLY
           ========================================= */
        .ball-loading-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.28);
            z-index: 20;
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: opacity 180ms ease, visibility 180ms ease;
        }

        .ball-loading-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .ball-loader {
            width: clamp(92px, 15vw, 150px);
            height: clamp(92px, 15vw, 150px);
            display: block;
            animation: ball-loader-spin 3.6s linear infinite;
        }

        .ball-loader .loader-ball {
            transform-origin: 50% 50%;
            animation: loader-ball-spin 2.2s linear infinite;
        }

        .ball-loader .loader-arrow {
            transform-origin: 50% 50%;
            animation: loader-arrows-spin 1.8s linear infinite;
        }

        .ball-loader .loader-ticks {
            transform-origin: 50% 50%;
            animation: loader-ticks-pulse 1.1s ease-in-out infinite;
        }

        @keyframes ball-loader-spin {
            from { transform: rotate(0deg); }
            to   { transform: rotate(360deg); }
        }

        @keyframes loader-ball-spin {
            from { transform: rotate(0deg); }
            to   { transform: rotate(-360deg); }
        }

        @keyframes loader-arrows-spin {
            from { transform: rotate(0deg); }
            to   { transform: rotate(-360deg); }
        }

        @keyframes loader-ticks-pulse {
            0%, 100% { opacity: 0.45; }
            50%      { opacity: 1; }
        }

        /* =========================================
           CONTROLS & SEARCH
           ========================================= */
        .controls {
            max-width: 1200px;
            margin: var(--space-6) auto;
            padding: 0 var(--space-4);
            display: flex;
            flex-wrap: wrap;
            gap: var(--space-4);
            align-items: center;
            justify-content: space-between;
        }

        .search-box {
            flex: 1 1 300px;
            min-width: 0;
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: var(--space-3) var(--space-4) var(--space-3) 44px;
            border-radius: 8px;
            border: 1px solid var(--border-default);
            background: var(--bg-surface);
            color: var(--text-primary);
            font-size: var(--text-base);
            outline: none;
            transition: border-color var(--duration-fast) var(--ease-out);
        }

        .search-box input:focus {
            border-color: var(--brand-primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
        }

        .search-box input::placeholder {
            color: var(--text-muted);
        }

        .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            width: 20px;
            height: 20px;
            pointer-events: none;
        }

        .category-filters {
            display: flex;
            gap: var(--space-2);
            overflow-x: auto;
            padding-bottom: var(--space-1);
            max-width: 100%;
            flex: 1 1 auto;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: thin;
        }

        .category-filters::-webkit-scrollbar {
            height: 4px;
        }

        .category-filters::-webkit-scrollbar-thumb {
            background: var(--border-default);
            border-radius: 4px;
        }

        .cat-btn {
            padding: var(--space-2) var(--space-4);
            border-radius: 6px;
            border: 1px solid var(--border-default);
            background: transparent;
            color: var(--text-muted);
            cursor: pointer;
            font-size: var(--text-sm);
            font-weight: 500;
            white-space: nowrap;
            flex-shrink: 0;
            transition: all var(--duration-normal) var(--ease-in-out);
        }

        .cat-btn:hover {
            background: var(--bg-surface);
            color: var(--text-primary);
            border-color: var(--text-muted);
        }

        .cat-btn.active {
            background: var(--brand-primary);
            border-color: var(--brand-primary);
            color: white;
            font-weight: 600;
        }

        /* =========================================
           SECTION HEADERS
           ========================================= */
        .section-header {
            max-width: 1200px;
            margin: var(--space-8) auto var(--space-4);
            padding: 0 var(--space-4);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: var(--space-3);
        }

        .section-header h2 {
            font-size: var(--text-lg);
            font-weight: 700;
            letter-spacing: -0.01em;
            display: flex;
            align-items: center;
            gap: var(--space-2);
        }

        .section-header h2 .dot-live {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent-live);
            box-shadow: 0 0 8px var(--accent-live);
            animation: pulse-live 1.5s ease-in-out infinite;
        }

        @keyframes pulse-live {
            0%, 100% { opacity: 1; transform: scale(1); }
            50%      { opacity: 0.5; transform: scale(0.85); }
        }

        .section-header .refresh-btn {
            padding: 6px 12px;
            border-radius: 6px;
            border: 1px solid var(--border-default);
            background: transparent;
            color: var(--text-muted);
            font-size: var(--text-xs);
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all var(--duration-fast) var(--ease-out);
        }

        .section-header .refresh-btn:hover {
            color: var(--text-primary);
            border-color: var(--brand-primary);
            background: var(--bg-surface);
        }

        .section-header .refresh-btn svg {
            width: 13px;
            height: 13px;
        }

        /* =========================================
           MATCHES GRID
           ========================================= */
        .matches-grid {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 var(--space-4);
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: var(--space-4);
        }

        .match-card {
            background: var(--bg-surface);
            border-radius: 10px;
            padding: var(--space-4);
            border: 1px solid var(--border-default);
            display: flex;
            flex-direction: column;
            gap: var(--space-3);
            transition:
                transform var(--duration-normal) var(--ease-out),
                box-shadow var(--duration-normal) var(--ease-out),
                border-color var(--duration-normal) var(--ease-out);
        }

        .match-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            border-color: var(--brand-primary);
        }

        .match-card-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: var(--space-2);
        }

        .match-category {
            font-size: var(--text-xs);
            text-transform: uppercase;
            letter-spacing: 0.6px;
            font-weight: 700;
            color: var(--brand-primary);
            background: rgba(99, 102, 241, 0.1);
            padding: 3px 8px;
            border-radius: 4px;
        }

        .match-status {
            font-size: var(--text-xs);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .match-status.live {
            color: var(--accent-live);
        }

        .match-status.live::before {
            content: '';
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--accent-live);
            animation: pulse-live 1.5s ease-in-out infinite;
        }

        .match-status.upcoming {
            color: var(--text-muted);
        }

        .match-teams {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: var(--space-3);
            padding: var(--space-2) 0;
        }

        .team {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: var(--space-2);
            flex: 1;
            min-width: 0;
        }

        .team-logo {
            width: 42px;
            height: 42px;
            object-fit: contain;
            border-radius: 50%;
            background: rgba(255,255,255,0.03);
            padding: 4px;
        }

        .team-logo-fallback {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: linear-gradient(135deg, #27272A, #1a1a2e);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: var(--text-sm);
            color: var(--text-muted);
        }

        .team-name {
            font-size: var(--text-sm);
            font-weight: 600;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100%;
            width: 100%;
        }

        .vs-badge {
            font-size: var(--text-xs);
            font-weight: 700;
            color: var(--text-muted);
            padding: 4px 8px;
            border-radius: 4px;
            background: rgba(255,255,255,0.04);
            flex-shrink: 0;
        }

        .match-time {
            font-size: var(--text-xs);
            color: var(--text-muted);
            text-align: center;
            font-weight: 500;
        }

        .watch-btn {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: none;
            font-weight: 700;
            font-size: var(--text-sm);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all var(--duration-fast) var(--ease-out);
        }

        .watch-btn.active {
            background: var(--accent-live);
            color: #fff;
        }

        .watch-btn.active:hover {
            background: #ff5c75;
            transform: translateY(-1px);
        }

        .watch-btn.disabled {
            background: rgba(255,255,255,0.04);
            color: var(--text-muted);
            cursor: not-allowed;
        }

        /* =========================================
           CHANNEL GRID
           ========================================= */
        .channel-grid {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 var(--space-4);
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: var(--space-4);
        }

        .channel-card {
            background: var(--bg-surface);
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            border: 1px solid var(--border-default);
            transition:
                transform var(--duration-normal) var(--ease-out),
                box-shadow var(--duration-normal) var(--ease-out),
                border-color var(--duration-normal) var(--ease-out);
        }

        .channel-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            border-color: var(--brand-primary);
        }

        .channel-card img {
            width: 100%;
            height: 120px;
            object-fit: contain;
            background: #0A0A0A;
            padding: var(--space-3);
            display: block;
        }

        .card-info {
            padding: var(--space-3);
            text-align: center;
        }

        .card-info h3 {
            font-size: var(--text-sm);
            font-weight: 600;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: var(--space-1);
        }

        .category-tag {
            font-size: var(--text-xs);
            color: var(--brand-primary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 700;
        }

        .status-message {
            grid-column: 1 / -1;
            text-align: center;
            color: var(--text-muted);
            padding: var(--space-12);
            font-size: var(--text-lg);
        }

        /* =========================================
           RESPONSIVE BREAKPOINTS
           ========================================= */
        @media (max-width: 1024px) {
            .channel-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                gap: var(--space-3);
            }
        }

        /* =========================
           AUTO FLOATING / DRAGGABLE MINI PLAYER
           ========================= */
        .player-section.is-floating {
            position: fixed;
            width: min(380px, calc(100vw - 36px));
            z-index: 9999;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 14px 45px rgba(0, 0, 0, .65);
            touch-action: none;
            cursor: grab;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .player-section.is-floating.is-dragging {
            cursor: grabbing;
            transition: none;
        }

        .player-section.is-floating .player-wrapper {
            width: 100%;
            max-width: none;
        }

        .player-spacer {
            display: none;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            aspect-ratio: 16 / 9;
        }

        .player-section.is-floating + .player-spacer {
            display: block;
        }

        .pip-actions {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 100;
            display: none;
            gap: 7px;
        }

        .player-section.is-floating .pip-actions {
            display: flex;
        }

        .pip-action {
            width: 36px;
            height: 36px;
            padding: 0;
            border: 1px solid rgba(255,255,255,.2);
            border-radius: 9px;
            background: rgba(0,0,0,.75);
            color: #fff;
            display: grid;
            place-items: center;
            cursor: pointer;
            backdrop-filter: blur(8px);
            touch-action: manipulation;
        }

        .pip-action:hover {
            background: rgba(0,0,0,.95);
        }

        .pip-action svg {
            width: 19px;
            height: 19px;
        }

        @media (max-width: 600px) {
            .player-section.is-floating {
                width: min(320px, calc(100vw - 20px));
            }
        }

        @media (max-width: 768px) {
            .controls {
                flex-direction: column;
                align-items: stretch;
                gap: var(--space-3);
                margin: var(--space-4) auto;
            }

            .search-box {
                flex-basis: auto;
            }

            .category-filters {
                flex-basis: auto;
                width: 100%;
            }

            .search-icon {
                left: 12px;
                width: 18px;
                height: 18px;
            }

            .cat-btn {
                padding: 6px 12px;
                font-size: 12px;
            }

            .channel-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: var(--space-2);
                padding: 0 var(--space-2);
            }

            .channel-card img {
                height: 80px;
                padding: var(--space-2);
            }

            .card-info {
                padding: var(--space-2);
            }

            .card-info h3 {
                font-size: 12px;
            }

            .category-tag {
                font-size: 10px;
            }

            .status-message {
                padding: var(--space-6);
                font-size: 15px;
            }

            .matches-grid {
                grid-template-columns: 1fr;
                padding: 0 var(--space-2);
                gap: var(--space-3);
            }

            .section-header {
                padding: 0 var(--space-3);
                margin: var(--space-6) auto var(--space-3);
            }

            .section-header h2 {
                font-size: var(--text-base);
            }
        }

        @media (max-width: 360px) {
            .channel-grid {
                grid-template-columns: 1fr;
            }

            .channel-card img {
                height: 100px;
            }
        }
    </style>
</head>

<body>

    <div class="player-section" id="playerSection">
        <div class="player-wrapper">

            <div class="pip-actions" aria-label="Floating player controls">
                <button class="pip-action" id="nativePipButton" type="button"
                        title="Picture in Picture" aria-label="Picture in Picture">
                    <i data-lucide="picture-in-picture"></i>
                </button>
                <button class="pip-action" id="closeFloatingButton" type="button"
                        title="Close floating player" aria-label="Close floating player">
                    <i data-lucide="x"></i>
                </button>
            </div>

            <video
                id="videoPlayer"
                controls
                playsinline>
            </video>

            <iframe
                id="iframePlayer"
                sandbox="allow-scripts allow-same-origin allow-presentation"
                allowfullscreen>
            </iframe>

            <!-- WATERMARK-FREE FOOTBALL LOADING ANIMATION -->
            <div class="ball-loading-overlay" id="ballLoadingOverlay" aria-hidden="true">
                <svg class="ball-loader" viewBox="0 0 200 200" role="img" aria-label="Loading video">
                    <g class="loader-arrow" fill="none" stroke-linecap="butt">
                        <path d="M36 77 A76 76 0 0 1 145 29" stroke="#8DB3E5" stroke-width="18"/>
                        <path d="M145 29 A76 76 0 0 1 171 145" stroke="#2F67A8" stroke-width="18"/>
                        <path d="M171 145 A76 76 0 0 1 55 172" stroke="#8DB3E5" stroke-width="18"/>
                        <path d="M55 172 A76 76 0 0 1 29 58" stroke="#2F67A8" stroke-width="18"/>
                        <path d="M142 20 L174 26 L150 48 Z" fill="#2F67A8" stroke="none"/>
                        <path d="M58 181 L27 176 L51 151 Z" fill="#2F67A8" stroke="none"/>
                    </g>

                    <g class="loader-ticks" stroke="#050505" stroke-width="5" stroke-linecap="round">
                        <line x1="100" y1="13"  x2="100" y2="29"/>
                        <line x1="171" y1="49"  x2="158" y2="57"/>
                        <line x1="187" y1="101" x2="171" y2="101"/>
                        <line x1="163" y1="156" x2="151" y2="146"/>
                        <line x1="101" y1="187" x2="101" y2="171"/>
                        <line x1="39"  y1="157" x2="51"  y2="147"/>
                        <line x1="13"  y1="101" x2="29"  y2="101"/>
                        <line x1="39"  y1="49"  x2="51"  y2="59"/>
                    </g>

                    <g class="loader-ball">
                        <circle cx="100" cy="100" r="38" fill="#fff" stroke="#050505" stroke-width="3"/>
                        <polygon points="100,82 112,91 107,106 93,106 88,91" fill="#050505"/>
                        <polygon points="100,82 112,91 125,87 116,75 103,72" fill="#050505"/>
                        <polygon points="112,91 125,87 132,101 122,111 107,106" fill="#fff" stroke="#050505" stroke-width="2.5"/>
                        <polygon points="107,106 122,111 121,126 108,134 95,125 93,106" fill="#fff" stroke="#050505" stroke-width="2.5"/>
                        <polygon points="93,106 95,125 82,132 70,121 72,105" fill="#fff" stroke="#050505" stroke-width="2.5"/>
                        <polygon points="88,91 93,106 72,105 67,91 80,81" fill="#fff" stroke="#050505" stroke-width="2.5"/>
                        <polygon points="88,91 80,81 91,70 103,72 100,82" fill="#050505"/>
                        <polygon points="72,105 70,121 61,111 63,98" fill="#050505"/>
                        <polygon points="95,125 108,134 96,138 82,132" fill="#050505"/>
                        <polygon points="121,126 121,111 134,105 137,119 128,130" fill="#050505"/>
                        <polygon points="125,87 116,75 126,78 133,90" fill="#050505"/>
                        <circle cx="100" cy="100" r="38" fill="none" stroke="#050505" stroke-width="3"/>
                    </g>
                </svg>
            </div>
        </div>
    </div>

    <!-- Reserves layout space while the player is floating -->
    <div class="player-spacer" id="playerSpacer" aria-hidden="true"></div>

    <!-- =========================================
         LIVE MATCHES SECTION (from Streamed.pk)
         ========================================= -->
    <div class="section-header">
        <h2><span class="dot-live"></span> Live Matches</h2>
        <button class="refresh-btn" id="refreshMatchesBtn" type="button">
            <i data-lucide="refresh-cw"></i> Refresh
        </button>
    </div>
    <div class="matches-grid" id="streamedMatches">
        <p class="status-message">Loading matches...</p>
    </div>

    <!-- =========================================
         CHANNELS SECTION
         ========================================= -->
    <div class="section-header">
        <h2>📺 All Channels</h2>
    </div>

    <div class="controls">
        <div class="search-box">
            <i data-lucide="search" class="search-icon"></i>
            <input type="text" id="searchInput" placeholder="Search channels...">
        </div>

        <div class="category-filters" id="categoryFilters"></div>
    </div>

    <div class="channel-grid" id="channelGrid"></div>

    <script src="channels.js"></script>

    <script>

        lucide.createIcons();

        const video              = document.getElementById('videoPlayer');
        const iframe             = document.getElementById('iframePlayer');
        const ballLoadingOverlay = document.getElementById('ballLoadingOverlay');
        const channelGrid        = document.getElementById('channelGrid');
        const searchInput        = document.getElementById('searchInput');
        const categoryFilters    = document.getElementById('categoryFilters');
        const streamedMatchesEl  = document.getElementById('streamedMatches');

        function clearInlineFloatPosition() {
            playerSection.style.left   = '';

            playerSection.style.right  = '';
            playerSection.style.bottom = '';
        }

        function getFloatMargin() {
            return window.innerWidth <= 600 ? 10 : 18;
        }

        function clampPosition(left, top, w, h) {
            const pad = 6;
            return {
                left: Math.max(pad, Math.min(window.innerWidth  - w - pad, left)),
                top:  Math.max(pad, Math.min(window.innerHeight - h - pad, top))
            };
        }

        function activateFloat() {
            playerSection.classList.add('is-floating');

            const w = playerSection.offsetWidth;
            const h = playerSection.offsetHeight;
            const margin = getFloatMargin();

            let left, top;

            if (savedFloatPosition) {
                left = savedFloatPosition.left;
                top  = savedFloatPosition.top;
            } else {
                left = window.innerWidth - w - margin;
                top  = (window.innerHeight - h) / 2;
            }

            const pos = clampPosition(left, top, w, h);

            playerSection.style.left   = pos.left + 'px';
            playerSection.style.top    = pos.top  + 'px';
            playerSection.style.right  = 'auto';
            playerSection.style.bottom = 'auto';
        }

        function deactivateFloat() {
            playerSection.classList.remove('is-floating');
            playerSection.classList.remove('is-dragging');
            clearInlineFloatPosition();
            dragState = null;
        }

                iframe.src &&
                iframe.src !== 'about:blank') {
