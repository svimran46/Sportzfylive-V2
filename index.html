<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sports Live TV</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg-primary: #09090B;
            --bg-surface: #131316;
            --border-default: #27272A;
            --text-primary: #FAFAFA;
            --text-muted: #A1A1AA;
            --brand-primary: #6366F1;
            --status-error: #EF4444;

            --space-1: 4px;
            --space-2: 8px;
            --space-3: 12px;
            --space-4: 16px;
            --space-6: 24px;
            --space-8: 32px;
            --space-12: 48px;

            --text-xs: 11px;
            --text-sm: 13px;
            --text-base: 15px;
            --text-lg: 18px;

            --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
            --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);
            --duration-fast: 150ms;
            --duration-normal: 250ms;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif;
        }

        html, body {
            width: 100%;
            overflow-x: hidden;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            font-size: var(--text-base);
            line-height: 1.5;
            padding-bottom: var(--space-12);
            -webkit-font-smoothing: antialiased;
        }

        /* =========================================
           PLAYER SECTION (always 16:9)
           ========================================= */
        .player-section {
            width: 100%;
            background: #000;
            position: relative;    /* was: sticky; top: 0;  — sticky blocks floating */
            z-index: 100;
            box-shadow: 0 4px 20px rgba(0,0,0,0.8);
            transition: box-shadow 220ms ease, border-radius 220ms ease;
        }

        .player-wrapper {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            position: relative;
            aspect-ratio: 16 / 9;
            background: #000;
        }

        #videoPlayer, #iframePlayer {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: none;
            display: none;
            background: #000;
        }

        /* =========================================
           VIDEO LOADING INDICATOR — BALL LOADER ONLY
           ========================================= */
        .ball-loading-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.28);
            z-index: 20;
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: opacity 180ms ease, visibility 180ms ease;
        }

        .ball-loading-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .ball-loader {
            width: clamp(92px, 15vw, 150px);
            height: clamp(92px, 15vw, 150px);
            display: block;
            animation: ball-loader-spin 3.6s linear infinite;
        }

        .ball-loader .loader-ball {
            transform-origin: 50% 50%;
            animation: loader-ball-spin 2.2s linear infinite;
        }

        .ball-loader .loader-arrow {
            transform-origin: 50% 50%;
            animation: loader-arrows-spin 1.8s linear infinite;
        }

        .ball-loader .loader-ticks {
            transform-origin: 50% 50%;
            animation: loader-ticks-pulse 1.1s ease-in-out infinite;
        }

        @keyframes ball-loader-spin {
            from { transform: rotate(0deg); }
            to   { transform: rotate(360deg); }
        }

        @keyframes loader-ball-spin {
            from { transform: rotate(0deg); }
            to   { transform: rotate(-360deg); }
        }

        @keyframes loader-arrows-spin {
            from { transform: rotate(0deg); }
            to   { transform: rotate(-360deg); }
        }

        @keyframes loader-ticks-pulse {
            0%, 100% { opacity: 0.45; }
            50%      { opacity: 1; }
        }

        /* =========================================
           CONTROLS & SEARCH
           ========================================= */
        .controls {
            max-width: 1200px;
            margin: var(--space-6) auto;
            padding: 0 var(--space-4);
            display: flex;
            flex-wrap: wrap;
            gap: var(--space-4);
            align-items: center;
            justify-content: space-between;
        }

        .search-box {
            flex: 1 1 300px;
            min-width: 0;
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: var(--space-3) var(--space-4) var(--space-3) 44px;
            border-radius: 8px;
            border: 1px solid var(--border-default);
            background: var(--bg-surface);
            color: var(--text-primary);
            font-size: var(--text-base);
            outline: none;
            transition: border-color var(--duration-fast) var(--ease-out);
        }

        .search-box input:focus {
            border-color: var(--brand-primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
        }

        .search-box input::placeholder {
            color: var(--text-muted);
        }

        .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            width: 20px;
            height: 20px;
            pointer-events: none;
        }

        .category-filters {
            display: flex;
            gap: var(--space-2);
            overflow-x: auto;
            padding-bottom: var(--space-1);
            max-width: 100%;
            flex: 1 1 auto;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: thin;
        }

        .category-filters::-webkit-scrollbar {
            height: 4px;
        }

        .category-filters::-webkit-scrollbar-thumb {
            background: var(--border-default);
            border-radius: 4px;
        }

        .cat-btn {
            padding: var(--space-2) var(--space-4);
            border-radius: 6px;
            border: 1px solid var(--border-default);
            background: transparent;
            color: var(--text-muted);
            cursor: pointer;
            font-size: var(--text-sm);
            font-weight: 500;
            white-space: nowrap;
            flex-shrink: 0;
            transition: all var(--duration-normal) var(--ease-in-out);
        }

        .cat-btn:hover {
            background: var(--bg-surface);
            color: var(--text-primary);
            border-color: var(--text-muted);
        }

        .cat-btn.active {
            background: var(--brand-primary);
            border-color: var(--brand-primary);
            color: white;
            font-weight: 600;
        }

        /* =========================================
           CHANNEL GRID (responsive columns)
           ========================================= */
        .channel-grid {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 var(--space-4);
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: var(--space-4);
        }

        .channel-card {
            background: var(--bg-surface);
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            border: 1px solid var(--border-default);
            transition:
                transform var(--duration-normal) var(--ease-out),
                box-shadow var(--duration-normal) var(--ease-out),
                border-color var(--duration-normal) var(--ease-out);
        }

        .channel-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            border-color: var(--brand-primary);
        }

        .channel-card img {
            width: 100%;
            height: 120px;
            object-fit: contain;
            background: #0A0A0A;
            padding: var(--space-3);
            display: block;
        }

        .card-info {
            padding: var(--space-3);
            text-align: center;
        }

        .card-info h3 {
            font-size: var(--text-sm);
            font-weight: 600;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: var(--space-1);
        }

        .category-tag {
            font-size: var(--text-xs);
            color: var(--brand-primary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 700;
        }

        .status-message {
            grid-column: 1 / -1;
            text-align: center;
            color: var(--text-muted);
            padding: var(--space-12);
            font-size: var(--text-lg);
        }

        /* =========================================
           RESPONSIVE BREAKPOINTS
           ========================================= */
        @media (max-width: 1024px) {
            .channel-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                gap: var(--space-3);
            }
        }

        /* =========================
           AUTO FLOATING / PIP PLAYER
           ========================= */
        .player-section.is-floating {
            position: fixed;
            top: auto;
            right: 18px;
            bottom: 18px;
            left: auto;
            width: min(380px, calc(100vw - 36px));
            z-index: 9999;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 14px 45px rgba(0, 0, 0, .65);
        }

        .player-section.is-floating .player-wrapper {
            width: 100%;
            max-width: none;
        }

        /* Reserves the original slot while the player floats */
        .player-spacer {
            display: none;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            aspect-ratio: 16 / 9;
        }

        .player-section.is-floating + .player-spacer {
            display: block;
        }

        .pip-actions {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 100;
            display: none;
            gap: 7px;
        }

        .player-section.is-floating .pip-actions {
            display: flex;
        }

        .pip-action {
            width: 36px;
            height: 36px;
            padding: 0;
            border: 1px solid rgba(255,255,255,.2);
            border-radius: 9px;
            background: rgba(0,0,0,.75);
            color: #fff;
            display: grid;
            place-items: center;
            cursor: pointer;
            backdrop-filter: blur(8px);
        }

        .pip-action:hover {
            background: rgba(0,0,0,.95);
        }

        .pip-action svg {
            width: 19px;
            height: 19px;
        }

        @media (max-width: 600px) {
            .player-section.is-floating {
                right: 10px;
                bottom: 10px;
                width: min(320px, calc(100vw - 20px));
            }
        }

        @media (max-width: 768px) {
            .controls {
                flex-direction: column;
                align-items: stretch;
                gap: var(--space-3);
                margin: var(--space-4) auto;
            }

            .search-box {
                flex-basis: auto;
            }

            .category-filters {
                flex-basis: auto;
                width: 100%;
            }

            .search-icon {
                left: 12px;
                width: 18px;
                height: 18px;
            }

            .cat-btn {
                padding: 6px 12px;
                font-size: 12px;
            }

            .channel-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: var(--space-2);
                padding: 0 var(--space-2);
            }

            .channel-card img {
                height: 80px;
                padding: var(--space-2);
            }

            .card-info {
                padding: var(--space-2);
            }

            .card-info h3 {
                font-size: 12px;
            }

            .category-tag {
                font-size: 10px;
            }

            .status-message {
                padding: var(--space-6);
                font-size: 15px;
            }
        }

        @media (max-width: 360px) {
            .channel-grid {
                grid-template-columns: 1fr;
            }

            .channel-card img {
                height: 100px;
            }
        }
    </style>
</head>

<body>

    <div class="player-section" id="playerSection">
        <div class="player-wrapper">

            <div class="pip-actions" aria-label="Floating player controls">
                <button class="pip-action" id="nativePipButton" type="button"
                        title="Picture in Picture" aria-label="Picture in Picture">
                    <i data-lucide="picture-in-picture"></i>
                </button>
                <button class="pip-action" id="closeFloatingButton" type="button"
                        title="Close floating player" aria-label="Close floating player">
                    <i data-lucide="x"></i>
                </button>
            </div>

            <video
                id="videoPlayer"
                controls
                playsinline>
            </video>

            <iframe
                id="iframePlayer"
                sandbox="allow-scripts allow-same-origin allow-presentation"
                allowfullscreen>
            </iframe>

            <!-- WATERMARK-FREE FOOTBALL LOADING ANIMATION -->
            <div
                class="ball-loading-overlay"
                id="ballLoadingOverlay"
                aria-hidden="true">

                <svg
                    class="ball-loader"
                    viewBox="0 0 200 200"
                    role="img"
                    aria-label="Loading video">

                    <!-- BLUE ROTATING ARROWS -->
                    <g
                        class="loader-arrow"
                        fill="none"
                        stroke-linecap="butt">

                        <path
                            d="M36 77 A76 76 0 0 1 145 29"
                            stroke="#8DB3E5"
                            stroke-width="18"/>

                        <path
                            d="M145 29 A76 76 0 0 1 171 145"
                            stroke="#2F67A8"
                            stroke-width="18"/>

                        <path
                            d="M171 145 A76 76 0 0 1 55 172"
                            stroke="#8DB3E5"
                            stroke-width="18"/>

                        <path
                            d="M55 172 A76 76 0 0 1 29 58"
                            stroke="#2F67A8"
                            stroke-width="18"/>

                        <path
                            d="M142 20 L174 26 L150 48 Z"
                            fill="#2F67A8"
                            stroke="none"/>

                        <path
                            d="M58 181 L27 176 L51 151 Z"
                            fill="#2F67A8"
                            stroke="none"/>
                    </g>

                    <!-- BLACK MOTION TICKS -->
                    <g
                        class="loader-ticks"
                        stroke="#050505"
                        stroke-width="5"
                        stroke-linecap="round">

                        <line x1="100" y1="13"  x2="100" y2="29"/>
                        <line x1="171" y1="49"  x2="158" y2="57"/>
                        <line x1="187" y1="101" x2="171" y2="101"/>
                        <line x1="163" y1="156" x2="151" y2="146"/>
                        <line x1="101" y1="187" x2="101" y2="171"/>
                        <line x1="39"  y1="157" x2="51"  y2="147"/>
                        <line x1="13"  y1="101" x2="29"  y2="101"/>
                        <line x1="39"  y1="49"  x2="51"  y2="59"/>
                    </g>

                    <!-- FOOTBALL -->
                    <g class="loader-ball">

                        <circle
                            cx="100"
                            cy="100"
                            r="38"
                            fill="#fff"
                            stroke="#050505"
                            stroke-width="3"/>

                        <polygon points="100,82 112,91 107,106 93,106 88,91" fill="#050505"/>
                        <polygon points="100,82 112,91 125,87 116,75 103,72" fill="#050505"/>
                        <polygon points="112,91 125,87 132,101 122,111 107,106" fill="#fff" stroke="#050505" stroke-width="2.5"/>
                        <polygon points="107,106 122,111 121,126 108,134 95,125 93,106" fill="#fff" stroke="#050505" stroke-width="2.5"/>
                        <polygon points="93,106 95,125 82,132 70,121 72,105" fill="#fff" stroke="#050505" stroke-width="2.5"/>
                        <polygon points="88,91 93,106 72,105 67,91 80,81" fill="#fff" stroke="#050505" stroke-width="2.5"/>
                        <polygon points="88,91 80,81 91,70 103,72 100,82" fill="#050505"/>
                        <polygon points="72,105 70,121 61,111 63,98" fill="#050505"/>
                        <polygon points="95,125 108,134 96,138 82,132" fill="#050505"/>
                        <polygon points="121,126 121,111 134,105 137,119 128,130" fill="#050505"/>
                        <polygon points="125,87 116,75 126,78 133,90" fill="#050505"/>

                        <circle
                            cx="100"

                            r="38"
                            fill="none"
                            stroke="#050505"
                            stroke-width="3"/>
                    </g>

                </svg>
            </div>
        </div>
    </div>

    <!-- Reserves layout space while the player is floating -->
    <div class="player-spacer" id="playerSpacer" aria-hidden="true"></div>

    <div class="controls">

        <div class="search-box">
            <i data-lucide="search" class="search-icon"></i>
            <input type="text" id="searchInput" placeholder="Search channels...">
        </div>

        <div class="category-filters" id="categoryFilters"></div>

    </div>

    <div class="channel-grid" id="channelGrid"></div>

    <script src="channels.js"></script>

    <script>

        lucide.createIcons();

        const video              = document.getElementById('videoPlayer');
        const iframe             = document.getElementById('iframePlayer');
        const ballLoadingOverlay = document.getElementById('ballLoadingOverlay');
        const channelGrid        = document.getElementById('channelGrid');
        const searchInput        = document.getElementById('searchInput');
        const categoryFilters    = document.getElementById('categoryFilters');

        const fallbackImg =
            'data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxODAiIGhlaWdodD0iMTIwIj48cmVjdCB3aWR0aD0iMTAwJSIgaGVpZ2h0PSIxMDAlIiBmaWxsPSIjMTMxMzE2Ii8+PHRleHQgeD0iNTAlIiB5PSI1MCUiIGZpbGw9IiM2MzY2RjEiIGZvbnQtc2l6ZT0iMTQiIHRleHQtYW5jaG9yPSJtaWRkbGUiIGR5PSIuM2VtIj5UVjwvdGV4dD48L3N2Zz4=';

        let hls;
        let allChannels    = [];
        let currentCategory = 'All';
        let searchTerm      = '';

        /* =========================================
           BALL LOADER FUNCTIONS
           ========================================= */
        function showBallLoader() {
            ballLoadingOverlay.classList.add('active');
        }

        function hideBallLoader() {
            ballLoadingOverlay.classList.remove('active');
        }

        /* =========================================
           VIDEO LOADING EVENTS
           ========================================= */
        video.addEventListener('waiting',   showBallLoader);
        video.addEventListener('stalled',   showBallLoader);
        video.addEventListener('loadstart', showBallLoader);
        video.addEventListener('playing',   hideBallLoader);
        video.addEventListener('canplay',   hideBallLoader);
        video.addEventListener('error',     hideBallLoader);
        iframe.addEventListener('load',     hideBallLoader);

        /* =========================================
           AUTO FLOATING / NATIVE PIP
           ========================================= */
        const playerSection       = document.getElementById('playerSection');
        const nativePipButton     = document.getElementById('nativePipButton');
        const closeFloatingButton = document.getElementById('closeFloatingButton');

        let floatingPlayerClosed = false;
        let floatThreshold       = 0;

        /* Measure where the player bottom sits in page coordinates.
           Measured while un-floated, so the value stays stable. */
        function recalcFloatThreshold() {
            if (!playerSection) return;

            const wasFloating = playerSection.classList.contains('is-floating');
            if (wasFloating) playerSection.classList.remove('is-floating');

            const rect = playerSection.getBoundingClientRect();
            floatThreshold = rect.bottom + window.scrollY;

            if (wasFloating) playerSection.classList.add('is-floating');
        }

        /* Is something actually playing right now? */
        function hasActivePlayback() {
            if (video.style.display !== 'none' &&
                video.src &&
                !video.paused &&
                !video.ended) {
                return true;
            }
            if (iframe.style.display !== 'none' &&
                iframe.src &&
                iframe.src !== 'about:blank') {
                return true;
            }
            return false;
        }

        function updateFloatingPlayer() {
            if (!playerSection) return;

            // Native browser PiP takes over — don't double up
            if (document.pictureInPictureElement) {
                playerSection.classList.remove('is-floating');
                return;
            }

            // Re-arm the close button once the user scrolls back to the top
            if (window.scrollY <= floatThreshold) {
                floatingPlayerClosed = false;
            }

            if (floatingPlayerClosed || !hasActivePlayback()) {
                playerSection.classList.remove('is-floating');
                return;
            }

            playerSection.classList.toggle(
                'is-floating',
                window.scrollY > floatThreshold
            );
        }

        function resetFloatingState() {
            floatingPlayerClosed = false;
            playerSection.classList.remove('is-floating');
        }

        /* --- listeners --- */
        window.addEventListener('scroll', updateFloatingPlayer, { passive: true });

        window.addEventListener('resize', () => {
            recalcFloatThreshold();
            updateFloatingPlayer();
        });

        window.addEventListener('load', () => {
            recalcFloatThreshold();
            updateFloatingPlayer();
        });

        window.addEventListener('orientationchange', () => {
            recalcFloatThreshold();
            updateFloatingPlayer();
        });

        video.addEventListener('play',    updateFloatingPlayer);
        video.addEventListener('playing', updateFloatingPlayer);
        video.addEventListener('pause',   updateFloatingPlayer);
        video.addEventListener('ended', () => {
            playerSection.classList.remove('is-floating');
        });

        if (closeFloatingButton) {
            closeFloatingButton.addEventListener('click', (event) => {
                event.preventDefault();
                event.stopPropagation();
                floatingPlayerClosed = true;
                playerSection.classList.remove('is-floating');
            });
        }

        if (nativePipButton) {
            nativePipButton.addEventListener('click', async (event) => {
                event.preventDefault();
                event.stopPropagation();

                try {
                    if (document.pictureInPictureElement) {
                        await document.exitPictureInPicture();
                        return;
                    }
                    if (!video.requestPictureInPicture) {
                        alert('Picture-in-Picture is not supported by this browser.');
                        return;
                    }
                    if (video.readyState < 1) {
                        alert('Start a video first.');
                        return;
                    }
                    await video.requestPictureInPicture();
                } catch (error) {
                    console.warn('Picture-in-Picture unavailable:', error);
                }
            });
        }

        video.addEventListener('enterpictureinpicture', () => {
            playerSection.classList.remove('is-floating');
        });

        video.addEventListener('leavepictureinpicture', () => {
            floatingPlayerClosed = false;
            updateFloatingPlayer();
        });

        /* =========================================
           PLAY CHANNEL
           ========================================= */
        function playChannel(url) {
            resetFloatingState();

            if (hls) {
                hls.destroy();
                hls = null;
            }

            video.pause();
            video.removeAttribute('src');
            video.load();
            video.style.display = 'none';

            iframe.src = 'about:blank';
            iframe.style.display = 'none';

            showBallLoader();

            if (url.includes('.m3u8')) {

                video.style.display = 'block';

                if (Hls.isSupported()) {

                    hls = new Hls();
                    hls.loadSource(url);
                    hls.attachMedia(video);

                    hls.on(Hls.Events.MANIFEST_PARSED, () => {
                        video.play().catch(() => {});
                    });

                    hls.on(Hls.Events.ERROR, (event, data) => {
                        if (data.fatal) hideBallLoader();
                    });

                } else if (video.canPlayType('application/vnd.apple.mpegurl')) {

                    video.src = url;

                    video.addEventListener('loadedmetadata', () => {
                        video.play().catch(() => {});
                    }, { once: true });

                } else {
                    hideBallLoader();
                }

            } else {

                iframe.style.display = 'block';

                iframe.onload = () => {
                    hideBallLoader();
                    updateFloatingPlayer();
                };

                iframe.src = url;
            }
        }

        /* =========================================
           RENDER CHANNELS
           ========================================= */
        function renderChannels() {

            channelGrid.innerHTML = '';

            const filtered = allChannels.filter(ch => {

                const matchesSearch =
                    ch.name.toLowerCase().includes(searchTerm.toLowerCase());

                const matchesCategory =
                    currentCategory === 'All' || ch.genre === currentCategory;

                return matchesSearch && matchesCategory;
            });

            if (filtered.length === 0) {
                channelGrid.innerHTML =
                    '<p class="status-message">No channels found.</p>';
                return;
            }

            filtered.forEach(ch => {

                const card = document.createElement('div');
                card.className = 'channel-card';

                card.innerHTML = `
                    <img
                        src="${ch.logo || fallbackImg}"
                        alt="${ch.name}"
                        onerror="this.src='${fallbackImg}'">

                    <div class="card-info">
                        <h3>${ch.name}</h3>
                        <span class="category-tag">
                            ${ch.genre || 'General'}
                        </span>
                    </div>
                `;

                card.addEventListener('click', () => {
                    playChannel(ch.url);
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                });

                channelGrid.appendChild(card);
            });
        }

        /* =========================================
           LOAD CHANNEL DATA
           ========================================= */
        if (typeof channels !== 'undefined' && channels.length > 0) {

            allChannels = channels;

            const categories = [
                'All',
                ...new Set(allChannels.map(ch => ch.genre))
            ];

            categoryFilters.innerHTML = '';

            categories.forEach(cat => {

                const btn = document.createElement('button');
                btn.className = `cat-btn ${cat === 'All' ? 'active' : ''}`;
                btn.textContent = cat;
                btn.dataset.cat = cat;

                btn.addEventListener('click', () => {

                    document.querySelectorAll('.cat-btn')
                        .forEach(b => b.classList.remove('active'));

                    btn.classList.add('active');
                    currentCategory = cat;
                    renderChannels();
                });

                categoryFilters.appendChild(btn);
            });

            renderChannels();

        } else {

            channelGrid.innerHTML =
                '<p class="status-message" style="color: var(--status-error);">Failed to load channel data. Please make sure channels.js is uploaded correctly.</p>';
        }

        /* =========================================
           SEARCH
           ========================================= */
        searchInput.addEventListener('input', (e) => {
            searchTerm = e.target.value;
            renderChannels();
        });

        /* =========================================
           INITIAL MEASUREMENT
           ========================================= */
        recalcFloatThreshold();
        window.requestAnimationFrame(() => {
            recalcFloatThreshold();
            updateFloatingPlayer();
        });

    </script>

</body>
</html>
