<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sports Live TV</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg-primary: #09090B;
            --bg-surface: #131316;
            --border-default: #27272A;
            --text-primary: #FAFAFA;
            --text-muted: #A1A1AA;
            --brand-primary: #6366F1;
            --status-error: #EF4444;

            --space-1: 4px;
            --space-2: 8px;
            --space-3: 12px;
            --space-4: 16px;
            --space-6: 24px;
            --space-8: 32px;
            --space-12: 48px;

            --text-xs: 11px;
            --text-sm: 13px;
            --text-base: 15px;
            --text-lg: 18px;

            --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
            --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);
            --duration-fast: 150ms;
            --duration-normal: 250ms;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif;
        }

        html, body {
            width: 100%;
            overflow-x: hidden;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            font-size: var(--text-base);
            line-height: 1.5;
            padding-bottom: var(--space-12);
            -webkit-font-smoothing: antialiased;
        }

        /* =========================================
           PLAYER SECTION (always 16:9, sticky top)
           ========================================= */
        .player-section {
            width: 100%;
            background: #000;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 20px rgba(0,0,0,0.8);
        }

        .player-wrapper {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            position: relative;
            aspect-ratio: 16 / 9;
            background: #000;
        }

        #videoPlayer, #iframePlayer {
            width: 100%;
            height: 100%;
            border: none;
            display: none;
        }

        /* =========================================
           CONTROLS & SEARCH
           ========================================= */
        .controls {
            max-width: 1200px;
            margin: var(--space-6) auto;
            padding: 0 var(--space-4);
            display: flex;
            flex-wrap: wrap;
            gap: var(--space-4);
            align-items: center;
            justify-content: space-between;
        }

        .search-box {
            flex: 1 1 300px;
            min-width: 0;
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: var(--space-3) var(--space-4) var(--space-3) 44px;
            border-radius: 8px;
            border: 1px solid var(--border-default);
            background: var(--bg-surface);
            color: var(--text-primary);
            font-size: var(--text-base);
            outline: none;
            transition: border-color var(--duration-fast) var(--ease-out);
        }

        .search-box input:focus {
            border-color: var(--brand-primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
        }

        .search-box input::placeholder {
            color: var(--text-muted);
        }

        .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            width: 20px;
            height: 20px;
            pointer-events: none;
        }

        .category-filters {
            display: flex;
            gap: var(--space-2);
            overflow-x: auto;
            padding-bottom: var(--space-1);
            max-width: 100%;
            flex: 1 1 auto;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: thin;
        }

        .category-filters::-webkit-scrollbar {
            height: 4px;
        }
        .category-filters::-webkit-scrollbar-thumb {
            background: var(--border-default);
            border-radius: 4px;
        }

        .cat-btn {
            padding: var(--space-2) var(--space-4);
            border-radius: 6px;
            border: 1px solid var(--border-default);
            background: transparent;
            color: var(--text-muted);
            cursor: pointer;
            font-size: var(--text-sm);
            font-weight: 500;
            white-space: nowrap;
            flex-shrink: 0;
            transition: all var(--duration-normal) var(--ease-in-out);
        }

        .cat-btn:hover {
            background: var(--bg-surface);
            color: var(--text-primary);
            border-color: var(--text-muted);
        }

        .cat-btn.active {
            background: var(--brand-primary);
            border-color: var(--brand-primary);
            color: white;
            font-weight: 600;
        }

        /* =========================================
           CHANNEL GRID (responsive columns)
           ========================================= */
        .channel-grid {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 var(--space-4);
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: var(--space-4);
        }

        .channel-card {
            background: var(--bg-surface);
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            border: 1px solid var(--border-default);
            transition: transform var(--duration-normal) var(--ease-out), 
                        box-shadow var(--duration-normal) var(--ease-out),
                        border-color var(--duration-normal) var(--ease-out);
        }

        .channel-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            border-color: var(--brand-primary);
        }

        .channel-card img {
            width: 100%;
            height: 120px;
            object-fit: contain;
            background: #0A0A0A;
            padding: var(--space-3);
            display: block;
        }

        .card-info {
            padding: var(--space-3);
            text-align: center;
        }

        .card-info h3 {
            font-size: var(--text-sm);
            font-weight: 600;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: var(--space-1);
        }

        .category-tag {
            font-size: var(--text-xs);
            color: var(--brand-primary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 700;
        }

        .status-message {
            grid-column: 1 / -1;
            text-align: center;
            color: var(--text-muted);
            padding: var(--space-12);
            font-size: var(--text-lg);
        }

        /* =========================================
           RESPONSIVE BREAKPOINTS
           ========================================= */

        @media (max-width: 1024px) {
            .channel-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                gap: var(--space-3);
            }
        }

        @media (max-width: 768px) {
            .controls {
                flex-direction: column;
                align-items: stretch;
                gap: var(--space-3);
                margin: var(--space-4) auto;
            }

            .search-box {
                flex: 1 1 auto;
            }

            .category-filters {
                flex: 1 1 auto;
                width: 100%;
            }

            .channel-grid {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
                gap: var(--space-3);
                padding: 0 var(--space-3);
            }

            .channel-card img {
                height: 100px;
            }
        }

        @media (max-width: 480px) {
            body {
                font-size: 14px;
            }

            .controls {
                padding: 0 var(--space-3);
            }

            .search-box input {
                padding: var(--space-3) var(--space-3) var(--space-3) 40px;
                font-size: 14px;
            }

            .search-icon {
                left: 12px;
                width: 18px;
                height: 18px;
            }

            .cat-btn {
                padding: 6px 12px;
                font-size: 12px;
            }

            .channel-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: var(--space-2);
                padding: 0 var(--space-2);
            }

            .channel-card img {
                height: 80px;
                padding: var(--space-2);
            }

            .card-info {
                padding: var(--space-2);
            }

            .card-info h3 {
                font-size: 12px;
            }

            .category-tag {
                font-size: 10px;
            }

            .status-message {
                padding: var(--space-6);
                font-size: 15px;
            }
        }

        @media (max-width: 360px) {
            .channel-grid {
                grid-template-columns: 1fr;
            }
            .channel-card img {
                height: 100px;
            }
        }
    </style>
</head>
<body>

    <div class="player-section">
        <div class="player-wrapper">
            <video id="videoPlayer" controls playsinline></video>
            <iframe id="iframePlayer" sandbox="allow-scripts allow-same-origin allow-presentation" allowfullscreen></iframe>
        </div>
    </div>

    <div class="controls">
        <div class="search-box">
            <i data-lucide="search" class="search-icon"></i>
            <input type="text" id="searchInput" placeholder="Search channels...">
        </div>
        <div class="category-filters" id="categoryFilters"></div>
    </div>

    <div class="channel-grid" id="channelGrid"></div>

    <script src="channels.js"></script>
    <script>
        lucide.createIcons();

        const video = document.getElementById('videoPlayer');
        const iframe = document.getElementById('iframePlayer');
        const channelGrid = document.getElementById('channelGrid');
        const searchInput = document.getElementById('searchInput');
        const categoryFilters = document.getElementById('categoryFilters');

        const fallbackImg = 'data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxODAiIGhlaWdodD0iMTIwIj48cmVjdCB3aWR0aD0iMTAwJSIgaGVpZ2h0PSIxMDAlIiBmaWxsPSIjMTMxMzE2Ii8+PHRleHQgeD0iNTAlIiB5PSI1MCUiIGZpbGw9IiM2MzY2RjEiIGZvbnQtc2l6ZT0iMTQiIHRleHQtYW5jaG9yPSJtaWRkbGUiIGR5PSIuM2VtIj5UVjwvdGV4dD48L3N2Zz4=';

        let hls;
        let allChannels = [];
        let currentCategory = 'All';
        let searchTerm = '';

        function playChannel(url) {
            if (hls) { hls.destroy(); hls = null; }
            video.pause();
            video.src = "";
            video.style.display = 'none';
            iframe.src = "about:blank";
            iframe.style.display = 'none';

            if (url.includes('.m3u8')) {
                video.style.display = 'block';
                if (Hls.isSupported()) {
                    hls = new Hls();
                    hls.loadSource(url);
                    hls.attachMedia(video);
                    hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
                } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                    video.src = url;
                    video.addEventListener('loadedmetadata', () => video.play());
                }
            } else {
                iframe.style.display = 'block';
                iframe.src = url;
            }
        }

        function renderChannels() {
            channelGrid.innerHTML = '';
            const filtered = allChannels.filter(ch => {
                const matchesSearch = ch.name.toLowerCase().includes(searchTerm.toLowerCase());
                const matchesCategory = currentCategory === 'All' || ch.genre === currentCategory;
                return matchesSearch && matchesCategory;
            });

            if (filtered.length === 0) {
                channelGrid.innerHTML = '<p class="status-message">No channels found.</p>';
                return;
            }

            filtered.forEach(ch => {
                const card = document.createElement('div');
                card.className = 'channel-card';
                card.innerHTML = `
                    <img src="${ch.logo || fallbackImg}" 
                         alt="${ch.name}" 
                         onerror="this.src='${fallbackImg}'">
                    <div class="card-info">
                        <h3>${ch.name}</h3>
                        <span class="category-tag">${ch.genre || 'General'}</span>
                    </div>
                `;
                card.addEventListener('click', () => {
                    playChannel(ch.url);
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                });
                channelGrid.appendChild(card);
            });
        }

        if (typeof channels !== 'undefined' && channels.length > 0) {
            allChannels = channels;

            const categories = ['All', ...new Set(allChannels.map(ch => ch.genre))];
            categoryFilters.innerHTML = '';
            categories.forEach(cat => {
                const btn = document.createElement('button');
                btn.className = `cat-btn ${cat === 'All' ? 'active' : ''}`;
                btn.textContent = cat;
                btn.dataset.cat = cat;
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentCategory = cat;
                    renderChannels();
                });
                categoryFilters.appendChild(btn);
            });

            renderChannels();
        } else {
            channelGrid.innerHTML = '<p class="status-message" style="color: var(--status-error);">Failed to load channel data. Please make sure channels.js is uploaded correctly.</p>';
        }

        searchInput.addEventListener('input', (e) => {
            searchTerm = e.target.value;
            renderChannels();
        });
    </script>
</body>
</html>
