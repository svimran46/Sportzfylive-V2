<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sportzfylive - Live Sports</title>
  
  <!-- Font Awesome for icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

  <!-- ================= CSS ================= -->
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #121212;
      color: #ffffff;
      padding: 20px;
    }

    /* Header Styles */
    .main-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      padding-bottom: 15px;
      border-bottom: 2px solid #2a2a2a;
    }

    .main-header h1 {
      font-size: 24px;
      color: #00d2ff;
    }

    #refresh-btn {
      background: #2a2a2a;
      color: #fff;
      border: 1px solid #444;
      padding: 8px 16px;
      border-radius: 5px;
      cursor: pointer;
      transition: 0.3s;
    }

    #refresh-btn:hover {
      background: #444;
    }

    /* Category Sections */
    .category-section {
      margin-bottom: 40px;
    }

    .category-title {
      font-size: 18px;
      color: #00d2ff;
      margin-bottom: 15px;
      text-transform: uppercase;
      letter-spacing: 1px;
      border-left: 4px solid #00d2ff;
      padding-left: 10px;
    }

    /* Match Grid */
    .matches-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }

    /* Match Card */
    .match-card {
      background: #1e1e1e;
      border-radius: 10px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
      transition: transform 0.2s;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .match-card:hover {
      transform: translateY(-5px);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .badge-live { color: #ff4444; }
    .badge-upcoming { color: #888; }

    .teams-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      min-height: 80px; /* Prevents layout shift */
    }

    .team {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* Fixed Logo Styling */
    .team-logo {
      width: 50px;
      height: 50px;
      object-fit: contain;
      margin-bottom: 8px;
      background: rgba(255, 255, 255, 0.05); /* Subtle background for transparent logos */
      border-radius: 50%;
      padding: 5px;
    }

    .fallback-logo {
      width: 50px;
      height: 50px;
      background: #2a2a2a;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: bold;
      color: #00d2ff;
      margin-bottom: 8px;
      border: 1px solid #444;
    }

    .team-name {
      font-size: 12px;
      font-weight: 600;
      max-width: 100px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .vs-text {
      font-weight: bold;
      color: #555;
      margin: 0 10px;
    }

    .match-date {
      font-size: 12px;
      color: #aaa;
      margin-bottom: 15px;
    }

    /* Buttons */
    .btn {
      display: block;
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 5px;
      font-weight: bold;
      cursor: pointer;
      text-decoration: none;
      transition: 0.3s;
    }

    .btn-watch {
      background: #00d2ff;
      color: #000;
    }

    .btn-watch:hover {
      background: #00a8cc;
    }

    .btn-disabled {
      background: #2a2a2a;
      color: #666;
      cursor: not-allowed;
    }

    /* Modal Styles */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.95);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      width: 90%;
      max-width: 900px;
      background: #000;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 0 20px rgba(0, 210, 255, 0.3);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px;
      background: #1e1e1e;
      border-bottom: 1px solid #333;
    }

    .close-btn {
      background: transparent;
      color: #ff4444;
      border: none;
      font-size: 24px;
      cursor: pointer;
    }

    .player-container {
      width: 100%;
      height: 500px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      background: #000;
    }

    .player-container iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Loading Spinner */
    .loading-spinner {
      text-align: center;
      font-size: 18px;
      color: #00d2ff;
      margin-top: 50px;
    }
  </style>

<style>

<body>

  <!-- Header -->
  <header class="main-header">
    <h1>⚡ Sportzfylive</h1>
    <button id="refresh-btn" onclick="loadMatches()">
      <i class="fas fa-sync-alt"></i> Refresh
    </button>
  </header>

  <!-- Main Container for Matches -->
  <main id="matches-container">
    <div class="loading-spinner">Loading matches...</div>
  </main>

  <!-- Stream Picker / Player -->
  <div id="stream-modal" class="modal">
    <div class="stream-page">
      <div class="stream-topbar">
        <button class="back-btn" type="button" onclick="closeModal()">← <span>Back</span></button>
        <button class="embed-btn" type="button" onclick="copyEmbedCode()">▣ <span>Embed Code</span></button>
      </div>

      <div class="stream-heading">
        <div>
          <h2>Available Streams</h2>
          <p id="stream-subtitle">Select a stream to watch</p>
        </div>
        <button class="theater-btn" type="button" onclick="toggleTheaterMode()">⛶ <span>Enter theater mode</span></button>
      </div>

      <div id="stream-picker"></div>

      <div id="player-container" class="player-container" hidden></div>
    </div>
  </div>

  <!-- ================= JAVASCRIPT ================= -->
  <script>
    const PROXY_URL = "https://streamedproxy.svimranmy.workers.dev";

    const CATEGORY_ORDER = [
        "LIVE",
        "TODAYS MATCHES",
        "FOOTBALL",
        "AMERICAN FOOTBALL",
        "BASKETBALL",
        "CRICKET",
        "BASEBALL",
        "RUGBY",
        "TENNIS",
        "MOTOR-SPORTS",
        "GOLF",
        "FIGHT",
        "OTHER"
    ];

    let loading = false;

    function esc(value) {
        return String(value ?? "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    function normalizeCategory(value) {
        const c = String(value || "").trim().toLowerCase();

        const aliases = {
            "american-football": "AMERICAN FOOTBALL",
            "american football": "AMERICAN FOOTBALL",
            "motor-sports": "MOTOR-SPORTS",
            "motorsports": "MOTOR-SPORTS"
        };

        return aliases[c] || (c ? c.toUpperCase() : "OTHER");
    }

    function resolveAssetUrl(value) {
        if (!value) return "";
        const url = String(value);

        if (/^(https?:)?\/\//i.test(url) || url.startsWith("data:")) {
            return url;
        }

        if (url.startsWith("/")) {
            return PROXY_URL + url;
        }

        return PROXY_URL + "/" + url;
    }

    function getLogoUrl(badge) {
        if (!badge) return "";
        const value = String(badge);
        if (/^(https?:)?\/\//i.test(value)) return value;
        return PROXY_URL + "/api/images/proxy/" + value;
    }

    function logoError(img, token) {
        if (img.dataset.logoFallback === "1") {
            img.style.display = "none";
            return;
        }
        img.dataset.logoFallback = "1";
        img.src = PROXY_URL + "/api/images/proxy/" + token + ".webp";
    }

    function safeDate(value) {
        if (value === null || value === undefined || value === "") return null;

        const n = Number(value);
        if (!Number.isFinite(n) || n <= 0) return null;

        const d = new Date(n);
        return Number.isNaN(d.getTime()) ? null : d;
    }

    function isToday(date) {
        if (!date) return false;

        const now = new Date();
        return date.getFullYear() === now.getFullYear() &&
               date.getMonth() === now.getMonth() &&
               date.getDate() === now.getDate();
    }

    function isLive(match) {
        return match?.live === true ||
               String(match?.status || "").toLowerCase() === "live";
    }

    function isChannel(match) {
        return !match?.teams?.home || !match?.teams?.away;
    }

    async function fetchJson(url, timeoutMs = 12000) {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), timeoutMs);

        try {
            const response = await fetch(url, {
                method: "GET",
                headers: { "Accept": "application/json" },
                signal: controller.signal
            });

            if (!response.ok) {
                throw new Error(`HTTP ${response.status}`);
            }

            return await response.json();
        } finally {
            clearTimeout(timer);
        }
    }

    async function loadMatches() {
        if (loading) return;

        loading = true;
        const app = document.getElementById("matches-container") ||
                    document.getElementById("app");

        if (app) {
            app.innerHTML = `
                <div class="loading-state">
                    <div class="loading-spinner"></div>
                    <p>Loading matches...</p>
                </div>`;
        }

        try {
            const data = await fetchJson(
                PROXY_URL + "/api/matches/all-today"
            );

            const matches = Array.isArray(data)
                ? data
                : Array.isArray(data?.matches)
                    ? data.matches
                    : [];

            if (!matches.length) {
                if (app) app.innerHTML = `<div class="empty-state">No matches available.</div>`;
                return;
            }

            renderMatches(matches);

        } catch (error) {
            console.error("Match API error:", error);

            if (app) {
                app.innerHTML = `
                    <div class="error-state">
                        <h3>Unable to load matches</h3>
                        <p>${esc(error.name === "AbortError"
                            ? "The request timed out."
                            : error.message)}</p>
                        <button type="button" onclick="loadMatches()">Retry</button>
                    </div>`;
            }
        } finally {
            loading = false;
        }
    }

    function renderMatches(matches) {
        const groups = Object.fromEntries(
            CATEGORY_ORDER.map(category => [category, []])
        );

        for (const match of matches) {
            if (!match || typeof match !== "object") continue;

            const date = safeDate(match.date ?? match.timestamp);

            if (isLive(match)) {
                groups.LIVE.push(match);
                continue;
            }

            if (isToday(date)) {
                groups["TODAYS MATCHES"].push(match);
                continue;
            }

            const category = normalizeCategory(match.category);
            (groups[category] || groups.OTHER).push(match);
        }
        window.__SPORTZFY_MATCHES = new Map(
            matches.filter(Boolean).map(match => [String(match.id || ""), match])
        );


        const container = document.getElementById("matches-container") ||
                          document.getElementById("app");

        let output = "";

        for (const category of CATEGORY_ORDER) {
            const list = groups[category];

            if (!list.length) continue;

            output += `
                <section class="category-section">
                    <h2>${esc(category)}</h2>
                    <div class="matches-grid">
                        ${list.map(buildMatchCard).join("")}
                    </div>
                </section>`;
        }

        container.innerHTML = output ||
            `<div class="empty-state">No matches available.</div>`;
    }

    function buildMatchCard(match) {
        const id = String(match.id || "");

        if (isChannel(match)) {
            const poster = resolveAssetUrl(match.poster);

            return `
                <article class="match-card channel-card">
                    ${poster
                        ? `<img class="channel-poster" src="${esc(poster)}" alt="${esc(match.title || "Channel")}" loading="lazy">`
                        : `<div class="channel-poster placeholder">TV</div>`}
                    <div class="match-title">${esc(match.title || "Channel")}</div>
                    ${match.popular ? `<span class="popular-badge">POPULAR</span>` : ""}
                    <button type="button" class="watch-btn" data-match-id="${esc(id)}">Watch Stream</button>
                </article>`;
        }

        const home = match.teams?.home || {};
        const away = match.teams?.away || {};
        const homeBadge = getLogoUrl(home.badge);
        const awayBadge = getLogoUrl(away.badge);
        const homeLogo = homeBadge
            ? `<img class="team-logo" src="${esc(homeBadge)}" data-logo-token="${esc(home.badge || "")}" onerror="logoError(this,this.dataset.logoToken)" alt="${esc(home.name || "Home")}" loading="lazy">`
            : `<div class="team-logo placeholder">?</div>`;
        const awayLogo = awayBadge
            ? `<img class="team-logo" src="${esc(awayBadge)}" data-logo-token="${esc(away.badge || "")}" onerror="logoError(this,this.dataset.logoToken)" alt="${esc(away.name || "Away")}" loading="lazy">`
            : `<div class="team-logo placeholder">?</div>`;

        return `
            <article class="match-card">
                <div class="match-title">${esc(match.title || `${home.name || "TBD"} vs ${away.name || "TBD"}`)}</div>
                <div class="teams">
                    <div class="team">${homeLogo}<div class="team-name">${esc(home.name || "TBD")}</div></div>
                    <div class="vs">VS</div>
                    <div class="team">${awayLogo}<div class="team-name">${esc(away.name || "TBD")}</div></div>
                </div>
                <button type="button" class="watch-btn" data-match-id="${esc(id)}">Watch Stream</button>
            </article>`;
    }

    /*
     * MANUAL STREAMS ONLY
     *
     * Nothing is fetched from a stream-source API.
     * The match/channel names come from /api/matches/all-today.
     * Add your own playable URLs here.
     *
     * Supported format:
     *
     * "admin-tennis-channel": [
     *   { name: "Stream 1", quality: "HD", language: "English", url: "YOUR_URL" },
     *   { name: "Stream 2", quality: "SD", language: "English", url: "YOUR_URL" }
     * ]
     */
    const MANUAL_STREAMS = {};

    let activeMatch = null;

    function getManualStreams(matchId) {
        const value = MANUAL_STREAMS[String(matchId)];
        if (Array.isArray(value)) return value;
        if (value && typeof value === "object" && value.url) return [value];
        return [];
    }

    function openManualStream(matchId) {
        const match = window.__SPORTZFY_MATCHES?.get(String(matchId));
        if (!match) return;

        activeMatch = match;

        const modal = document.getElementById("stream-modal");
        const picker = document.getElementById("stream-picker");
        const player = document.getElementById("player-container");

        if (!modal || !picker || !player) return;

        const streams = getManualStreams(matchId);
        const title = match.title || "Channel";
        const count = streams.length;

        document.getElementById("stream-subtitle").textContent =
            `${title} • ${count} manual stream${count === 1 ? "" : "s"} added`;

        player.hidden = true;
        player.replaceChildren();

        if (!count) {
            picker.innerHTML = `
                <div class="stream-source-box">
                    <div class="source-head">
                        <div>
                            <div class="source-name">Admin</div>
                            <div class="source-note">✣ Admin added streams</div>
                        </div>
                        <div class="stream-count">0 streams</div>
                    </div>
                    <div class="no-manual-streams">
                        <strong>${esc(title)}</strong>
                        No manual streams have been added yet.
                    </div>
                </div>`;
        } else {
            picker.innerHTML = `
                <div class="stream-source-box">
                    <div class="source-head">
                        <div>
                            <div class="source-name">Admin</div>
                            <div class="source-note">✣ Admin added streams</div>
                        </div>
                        <div class="stream-count">${count} stream${count === 1 ? "" : "s"}</div>
                    </div>
                    <div class="stream-list">
                        ${streams.map((stream, index) => `
                            <button class="stream-option ${index === 0 ? "current" : ""}"
                                    type="button"
                                    data-stream-index="${index}">
                                <span class="quality-pill">${esc(stream.quality || "SD")}</span>
                                <span class="stream-label">${esc(stream.name || `Stream ${index + 1}`)}</span>
                                ${index === 0 ? `<span class="current-label">✓ Current</span>` : ""}
                                <span class="stream-meta">
                                    <span>◉ ${esc(stream.language || "English")}</span>
                                </span>
                            </button>
                        `).join("")}
                    </div>
                </div>`;
        }

        modal.style.display = "flex";
        document.body.style.overflow = "hidden";
    }

    function playManualStream(index) {
        if (!activeMatch) return;

        const streams = getManualStreams(activeMatch.id);
        const stream = streams[index];
        if (!stream?.url) return;

        const picker = document.getElementById("stream-picker");
        const player = document.getElementById("player-container");
        if (!picker || !player) return;

        const iframe = document.createElement("iframe");
        iframe.src = stream.url;
        iframe.allowFullscreen = true;
        iframe.setAttribute("allow", "autoplay; fullscreen; picture-in-picture");
        iframe.setAttribute("referrerpolicy", "no-referrer-when-downgrade");
        iframe.frameBorder = "0";

        player.hidden = false;
        player.replaceChildren(iframe);

        picker.querySelectorAll(".stream-option").forEach((button, i) => {
            button.classList.toggle("current", i === Number(index));
            const current = button.querySelector(".current-label");
            if (i === Number(index)) {
                if (!current) {
                    const label = document.createElement("span");
                    label.className = "current-label";
                    label.textContent = "✓ Current";
                    button.insertBefore(label, button.querySelector(".stream-meta"));
                }
            } else if (current) {
                current.remove();
            }
        });
    }

    function toggleTheaterMode() {
        document.querySelector(".stream-page")?.classList.toggle("theater");
    }

    async function copyEmbedCode() {
        if (!activeMatch) return;
        const url = location.href.split("#")[0] + "#match=" + encodeURIComponent(activeMatch.id);
        try {
            await navigator.clipboard.writeText(`<iframe src="${url}" width="100%" height="500" frameborder="0" allowfullscreen></iframe>`);
        } catch (_) {}
    }

    function closeModal() {
        const modal = document.getElementById("stream-modal");
        const player = document.getElementById("player-container");

        if (modal) modal.style.display = "none";
        if (player) {
            player.hidden = true;
            player.replaceChildren();
        }
        document.querySelector(".stream-page")?.classList.remove("theater");
        document.body.style.overflow = "";
        activeMatch = null;
    }

    document.addEventListener("click", event => {
        const matchButton = event.target.closest("[data-match-id]");
        if (matchButton && !matchButton.disabled) {
            openManualStream(matchButton.dataset.matchId);
            return;
        }

        const streamButton = event.target.closest("[data-stream-index]");
        if (streamButton) {
            playManualStream(Number(streamButton.dataset.streamIndex));
            return;
        }

        const modal = document.getElementById("stream-modal");
        if (modal && event.target === modal) closeModal();
    });

    document.addEventListener("keydown", event => {
        if (event.key === "Escape") closeModal();
    });

    document.addEventListener("DOMContentLoaded", loadMatches);
</script>
</body>
</html>
