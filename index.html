<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sportzfylive - Live Sports</title>
  
  <!-- Font Awesome for icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

  <!-- ================= CSS ================= -->
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #121212;
      color: #ffffff;
      padding: 20px;
    }

    /* Header Styles */
    .main-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      padding-bottom: 15px;
      border-bottom: 2px solid #2a2a2a;
    }

    .main-header h1 {
      font-size: 24px;
      color: #00d2ff;
    }

    #refresh-btn {
      background: #2a2a2a;
      color: #fff;
      border: 1px solid #444;
      padding: 8px 16px;
      border-radius: 5px;
      cursor: pointer;
      transition: 0.3s;
    }

    #refresh-btn:hover {
      background: #444;
    }

    /* Category Sections */
    .category-section {
      margin-bottom: 40px;
    }

    .category-title {
      font-size: 18px;
      color: #00d2ff;
      margin-bottom: 15px;
      text-transform: uppercase;
      letter-spacing: 1px;
      border-left: 4px solid #00d2ff;
      padding-left: 10px;
    }

    /* Match Grid */
    .matches-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }

    /* Match Card */
    .match-card {
      background: #1e1e1e;
      border-radius: 10px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
      transition: transform 0.2s;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .match-card:hover {
      transform: translateY(-5px);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .badge-live { color: #ff4444; }
    .badge-upcoming { color: #888; }

    .teams-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      min-height: 80px; /* Prevents layout shift */
    }

    .team {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* Fixed Logo Styling */
    .team-logo {
      width: 50px;
      height: 50px;
      object-fit: contain;
      margin-bottom: 8px;
      background: rgba(255, 255, 255, 0.05); /* Subtle background for transparent logos */
      border-radius: 50%;
      padding: 5px;
    }

    .fallback-logo {
      width: 50px;
      height: 50px;
      background: #2a2a2a;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: bold;
      color: #00d2ff;
      margin-bottom: 8px;
      border: 1px solid #444;
    }

    .team-name {
      font-size: 12px;
      font-weight: 600;
      max-width: 100px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .vs-text {
      font-weight: bold;
      color: #555;
      margin: 0 10px;
    }

    .match-date {
      font-size: 12px;
      color: #aaa;
      margin-bottom: 15px;
    }

    /* Buttons */
    .btn {
      display: block;
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 5px;
      font-weight: bold;
      cursor: pointer;
      text-decoration: none;
      transition: 0.3s;
    }

    .btn-watch {
      background: #00d2ff;
      color: #000;
    }

    .btn-watch:hover {
      background: #00a8cc;
    }

    .btn-disabled {
      background: #2a2a2a;
      color: #666;
      cursor: not-allowed;
    }

    /* Modal Styles */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.95);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      width: 90%;
      max-width: 900px;
      background: #000;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 0 20px rgba(0, 210, 255, 0.3);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px;
      background: #1e1e1e;
      border-bottom: 1px solid #333;
    }

    .close-btn {
      background: transparent;
      color: #ff4444;
      border: none;
      font-size: 24px;
      cursor: pointer;
    }

    .player-container {
      width: 100%;
      height: 500px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      background: #000;
    }

    .player-container iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Loading Spinner */
    .loading-spinner {
      text-align: center;
      font-size: 18px;
      color: #00d2ff;
      margin-top: 50px;
    }
  </style>

<style>
.loading-state,.empty-state,.error-state,.stream-message{text-align:center;padding:40px}
.error-state{color:#ff7777}
.error-state button{margin-top:12px}
.channel-poster{width:100%;height:180px;object-fit:contain;background:#080808;border-radius:10px}
.placeholder{display:flex;align-items:center;justify-content:center;background:#222;color:#777}
.popular-badge{display:inline-block;margin-top:8px;font-size:10px;padding:4px 7px;border-radius:5px;background:#333}
.stream-message{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#aaa}
.stream-message h3{color:#fff}
</style>


<style>
/* Stream-picker UI inspired by the supplied reference image. */
.stream-page{
  width:min(1280px,94vw);
  max-height:92vh;
  overflow:auto;
  background:#0d1117;
  border:1px solid #242b35;
  border-radius:18px;
  box-shadow:0 20px 70px rgba(0,0,0,.65);
  padding:22px 28px 28px;
  color:#f5f7fa;
}
.stream-topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:24px;
}
.back-btn,.embed-btn,.theater-btn{
  border:1px solid #303946;
  background:#111821;
  color:#e9edf2;
  border-radius:9px;
  padding:10px 15px;
  font-weight:700;
  cursor:pointer;
}
.back-btn:hover,.embed-btn:hover,.theater-btn:hover{background:#18212c}
.stream-heading{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:20px;
  margin-bottom:18px;
}
.stream-heading h2{
  margin:0 0 7px;
  font-size:30px;
  letter-spacing:-.4px;
}
.stream-heading p{
  margin:0;
  color:#9ca7b5;
  font-size:14px;
}
.stream-source-box{
  border:1px solid #c4b33c;
  border-radius:12px;
  overflow:hidden;
  background:linear-gradient(180deg,#151a20,#10151b);
}
.source-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:17px 18px;
  border-bottom:1px solid #55501e;
}
.source-name{
  font-size:18px;
  font-weight:800;
}
.source-note{
  color:#ffd400;
  font-size:13px;
  font-weight:700;
  margin-top:4px;
}
.stream-count{
  color:#ff6454;
  font-size:14px;
  font-weight:800;
}
.stream-list{padding:10px 9px}
.stream-option{
  width:100%;
  display:flex;
  align-items:center;
  gap:13px;
  border:1px solid transparent;
  background:transparent;
  color:#f3f5f7;
  padding:13px 14px;
  border-radius:9px;
  cursor:pointer;
  text-align:left;
  transition:.16s ease;
}
.stream-option:hover{background:#19212a;border-color:#38434f}
.stream-option.current{
  border-color:#ff5a43;
  box-shadow:inset 4px 0 #ff5a43;
  background:#151b21;
}
.quality-pill{
  min-width:38px;
  padding:5px 7px;
  border-radius:6px;
  background:#28313b;
  color:#fff;
  font-size:11px;
  font-weight:900;
  text-align:center;
}
.stream-option.current .quality-pill{background:#ff513d}
.stream-label{font-size:16px;font-weight:800}
.current-label{color:#ff654f;font-size:13px;font-weight:800}
.stream-meta{
  margin-left:auto;
  color:#d9dee5;
  font-size:13px;
  display:flex;
  align-items:center;
  gap:12px;
}
.more-streams{
  margin-top:14px;
  border:1px solid #303946;
  background:#111821;
  color:#dce2e9;
  border-radius:9px;
  padding:11px 15px;
  cursor:pointer;
}
.no-manual-streams{
  padding:38px 20px;
  text-align:center;
  color:#9ca7b5;
}
.no-manual-streams strong{display:block;color:#fff;font-size:17px;margin-bottom:7px}
.player-container{
  margin-top:18px;
  min-height:500px;
  width:100%;
  background:#000;
  border-radius:12px;
  overflow:hidden;
}
.player-container iframe{width:100%;height:500px;border:0}
.stream-page.theater{
  width:100vw;
  max-width:none;
  max-height:none;
  height:100vh;
  border-radius:0;
  padding:18px 28px;
}
@media(max-width:700px){
  .stream-page{width:96vw;padding:16px;border-radius:12px}
  .stream-heading{align-items:flex-start;flex-direction:column}
  .stream-heading h2{font-size:24px}
  .stream-meta{font-size:11px}
  .stream-option{padding:12px 10px}
  .player-container,.player-container iframe{min-height:260px;height:260px}
}
</style>

<style>
/* =========================================================
   SPORTZFYLIVE DESIGN SYSTEM
   Semantic tokens • 4px spacing • compact sports UI
   ========================================================= */
:root{
  --bg-primary:#09090b;
  --bg-surface:#131316;
  --bg-elevated:#18181b;
  --bg-hover:#1f1f23;
  --border-default:#27272a;
  --border-subtle:#1d1d20;
  --text-primary:#fafafa;
  --text-muted:#a1a1aa;
  --text-faint:#71717a;
  --brand-primary:#6366f1;
  --brand-hover:#818cf8;
  --status-success:#22c55e;
  --status-error:#ef4444;
  --status-warning:#f59e0b;
  --space-1:4px;
  --space-2:8px;
  --space-3:12px;
  --space-4:16px;
  --space-6:24px;
  --space-8:32px;
  --space-12:48px;
  --radius-sm:8px;
  --radius-md:12px;
  --radius-lg:16px;
  --shadow-card:0 8px 30px rgba(0,0,0,.24);
  --ease-out:cubic-bezier(.16,1,.3,1);
}

*{box-sizing:border-box}
html{background:var(--bg-primary)}
body{
  margin:0;
  min-height:100vh;
  padding:0;
  background:
    radial-gradient(900px 500px at 50% -180px,rgba(99,102,241,.10),transparent 65%),
    var(--bg-primary);
  color:var(--text-primary);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:15px;
  line-height:1.55;
}

/* Header */
.main-header{
  position:sticky;
  top:0;
  z-index:50;
  width:100%;
  margin:0 0 var(--space-8);
  padding:14px clamp(16px,4vw,48px);
  border:0;
  border-bottom:1px solid rgba(39,39,42,.9);
  background:rgba(9,9,11,.82);
  backdrop-filter:blur(18px);
  display:flex;
  align-items:center;
  justify-content:space-between;
}
.main-header h1{
  margin:0;
  color:var(--text-primary);
  font-size:20px;
  line-height:1.2;
  font-weight:800;
  letter-spacing:-.4px;
}
.main-header h1::first-letter{color:var(--brand-primary)}
#refresh-btn{
  min-height:44px;
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:0 14px;
  border:1px solid var(--border-default);
  border-radius:var(--radius-sm);
  background:var(--bg-surface);
  color:var(--text-primary);
  font-size:13px;
  font-weight:600;
  cursor:pointer;
  transition:background 100ms ease,border-color 100ms ease,transform 100ms ease;
}
#refresh-btn:hover{background:var(--bg-hover);border-color:#3f3f46}
#refresh-btn:active{transform:scale(.98)}
#refresh-btn i{color:var(--brand-hover)}

/* Main layout */
#matches-container{
  width:min(1440px,100%);
  margin:0 auto;
  padding:0 clamp(16px,4vw,48px) 64px;
}
.category-section{margin:0 0 var(--space-12)}
.category-section h2{
  margin:0 0 var(--space-4);
  display:flex;
  align-items:center;
  gap:10px;
  color:var(--text-primary);
  font-size:18px;
  line-height:1.2;
  font-weight:700;
  letter-spacing:-.2px;
}
.category-section h2::before{
  content:"";
  width:4px;
  height:20px;
  border-radius:999px;
  background:var(--brand-primary);
}
.category-section:first-child h2::before{background:var(--status-success)}

.matches-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
  gap:var(--space-4);
}

/* Match card */
.match-card{
  position:relative;
  min-width:0;
  padding:var(--space-4);
  border:1px solid var(--border-default);
  border-radius:var(--radius-md);
  background:linear-gradient(180deg,var(--bg-surface),#101012);
  box-shadow:var(--shadow-card);
  text-align:center;
  transition:transform 200ms var(--ease-out),border-color 200ms ease,background 200ms ease;
}
.match-card:hover{
  transform:translateY(-3px);
  border-color:#3f3f46;
  background:var(--bg-elevated);
}
.match-card::after{
  content:"";
  position:absolute;
  inset:0;
  border-radius:inherit;
  pointer-events:none;
  background:linear-gradient(135deg,rgba(99,102,241,.045),transparent 45%);
}
.match-title{
  position:relative;
  z-index:1;
  min-height:40px;
  margin-bottom:var(--space-3);
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--text-primary);
  font-size:14px;
  line-height:1.35;
  font-weight:650;
}
.teams{
  position:relative;
  z-index:1;
  min-height:112px;
  display:grid;
  grid-template-columns:1fr 42px 1fr;
  align-items:center;
  gap:var(--space-2);
  padding:var(--space-2) 0 var(--space-3);
}
.team{
  min-width:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:var(--space-2);
}
.team-logo{
  width:56px;
  height:56px;
  object-fit:contain;
  padding:7px;
  border:1px solid var(--border-default);
  border-radius:50%;
  background:#0d0d10;
}
.team-logo.placeholder{
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--text-faint);
}
.team-name{
  width:100%;
  max-width:105px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  color:#e4e4e7;
  font-size:12px;
  font-weight:600;
}
.vs{
  width:34px;
  height:34px;
  display:flex;
  align-items:center;
  justify-content:center;
  border:1px solid var(--border-default);
  border-radius:50%;
  background:#0d0d10;
  color:var(--text-faint);
  font-size:10px;
  font-weight:800;
}
.match-meta{
  position:relative;
  z-index:1;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  min-height:28px;
  margin-bottom:var(--space-3);
  color:var(--text-muted);
  font-size:12px;
}
.match-status{
  display:inline-flex;
  align-items:center;
  gap:5px;
  padding:4px 7px;
  border:1px solid var(--border-default);
  border-radius:999px;
  background:#0d0d10;
  color:var(--text-muted);
  font-size:10px;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:.4px;
}
.match-status.live{
  border-color:rgba(34,197,94,.35);
  background:rgba(34,197,94,.08);
  color:var(--status-success);
}
.match-status.live::before{
  content:"";
  width:6px;height:6px;border-radius:50%;
  background:currentColor;
  box-shadow:0 0 0 3px rgba(34,197,94,.10);
}
.watch-btn{
  position:relative;
  z-index:1;
  width:100%;
  min-height:44px;
  padding:0 14px;
  border:1px solid rgba(99,102,241,.55);
  border-radius:var(--radius-sm);
  background:var(--brand-primary);
  color:#fff;
  font-size:13px;
  font-weight:700;
  cursor:pointer;
  transition:background 100ms ease,transform 100ms ease,box-shadow 100ms ease;
}
.watch-btn:hover{
  background:var(--brand-hover);
  box-shadow:0 6px 18px rgba(99,102,241,.18);
}
.watch-btn:active{transform:scale(.985)}
.popular-badge{
  position:absolute;
  top:12px;
  right:12px;
  z-index:2;
  margin:0;
  padding:4px 7px;
  border:1px solid var(--border-default);
  border-radius:999px;
  background:rgba(9,9,11,.8);
  color:#d4d4d8;
  font-size:9px;
  font-weight:700;
  letter-spacing:.5px;
}

/* Channel cards */
.channel-card{text-align:left}
.channel-poster{
  position:relative;
  z-index:1;
  width:100%;
  height:150px;
  margin-bottom:var(--space-3);
  border:1px solid var(--border-default);
  border-radius:var(--radius-sm);
  object-fit:contain;
  background:#09090b;
}
.channel-card .match-title{
  justify-content:flex-start;
  min-height:auto;
  margin-bottom:var(--space-4);
}
.channel-card .watch-btn{margin-top:var(--space-2)}
.placeholder{
  display:flex;
  align-items:center;
  justify-content:center;
  background:#18181b;
  color:var(--text-faint);
}

/* Loading / empty / error */
.loading-state,.empty-state,.error-state{
  width:min(600px,100%);
  margin:80px auto;
  padding:var(--space-8);
  border:1px solid var(--border-default);
  border-radius:var(--radius-md);
  background:var(--bg-surface);
  text-align:center;
  color:var(--text-muted);
}
.loading-spinner{
  width:28px;
  height:28px;
  margin:0 auto var(--space-3);
  border:2px solid #27272a;
  border-top-color:var(--brand-primary);
  border-radius:50%;
  animation:sportzfy-spin .7s linear infinite;
}
@keyframes sportzfy-spin{to{transform:rotate(360deg)}}
.error-state h3{margin:0 0 6px;color:var(--text-primary);font-size:18px}
.error-state p{margin:0}
.error-state button{
  min-height:44px;
  margin-top:var(--space-4);
  padding:0 16px;
  border:1px solid var(--border-default);
  border-radius:var(--radius-sm);
  background:var(--bg-elevated);
  color:var(--text-primary);
  cursor:pointer;
}

/* Stream modal foundation */
.modal{background:rgba(9,9,11,.88);backdrop-filter:blur(8px)}
.stream-page{
  border-color:var(--border-default);
  background:var(--bg-surface);
  box-shadow:0 24px 80px rgba(0,0,0,.7);
}
.stream-heading h2{font-weight:700;letter-spacing:-.5px}
.back-btn,.embed-btn,.theater-btn{
  min-height:44px;
  border-color:var(--border-default);
  border-radius:var(--radius-sm);
  background:var(--bg-elevated);
}
.back-btn:hover,.embed-btn:hover,.theater-btn:hover{background:var(--bg-hover)}
.stream-source-box{border-color:#3f3f46}
.source-head{border-bottom-color:var(--border-default)}
.source-note{color:var(--brand-hover)}
.stream-option.current{
  border-color:var(--brand-primary);
  box-shadow:inset 3px 0 var(--brand-primary);
}
.stream-option.current .quality-pill{background:var(--brand-primary)}
.current-label{color:var(--brand-hover)}
.quality-pill{background:#27272a}

/* Responsive */
@media(max-width:720px){
  .main-header{padding:12px 16px;margin-bottom:var(--space-6)}
  .main-header h1{font-size:18px}
  #matches-container{padding:0 12px 48px}
  .category-section{margin-bottom:40px}
  .matches-grid{
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:10px;
  }
  .match-card{padding:12px;border-radius:10px}
  .match-title{font-size:12px;min-height:34px}
  .teams{grid-template-columns:1fr 30px 1fr;min-height:94px}
  .team-logo{width:46px;height:46px;padding:6px}
  .team-name{font-size:10px}
  .vs{width:28px;height:28px;font-size:9px}
  .match-meta{font-size:10px}
  .watch-btn{min-height:42px;font-size:12px}
  .channel-poster{height:110px}
}
@media(max-width:380px){
  .matches-grid{grid-template-columns:1fr}
}
@media(prefers-reduced-motion:reduce){

  <script>
    const PROXY_URL = "https://sportzfylive.svimranmy.workers.dev";

    const CATEGORY_ORDER = [
        "LIVE",
        "TODAYS MATCHES",
        "FOOTBALL",
        "AMERICAN FOOTBALL",
        "BASKETBALL",
        "CRICKET",
        "BASEBALL",
        "RUGBY",
        "TENNIS",
        "MOTOR-SPORTS",
        "GOLF",
        "FIGHT",
        "OTHER"
    ];

    let loading = false;

    function esc(value) {
        return String(value ?? "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    function normalizeCategory(value) {
        const c = String(value || "").trim().toLowerCase();

        const aliases = {
            "american-football": "AMERICAN FOOTBALL",
            "american football": "AMERICAN FOOTBALL",
            "motor-sports": "MOTOR-SPORTS",
            "motorsports": "MOTOR-SPORTS"
        };

        return aliases[c] || (c ? c.toUpperCase() : "OTHER");
    }

    function resolveAssetUrl(value) {
        if (!value) return "";
        const url = String(value);

        if (/^(https?:)?\/\//i.test(url) || url.startsWith("data:")) {
            return url;
        }

        if (url.startsWith("/")) {
            return PROXY_URL + url;
        }

        return PROXY_URL + "/" + url;
    }

    function getLogoUrl(badge) {
        if (!badge) return "";
        const value = String(badge);
        if (/^(https?:)?\/\//i.test(value)) return value;
        return PROXY_URL + "/api/images/proxy/" + value;
    }

    function logoError(img, token) {
        if (img.dataset.logoFallback === "1") {
            img.style.display = "none";
            return;
        }
        img.dataset.logoFallback = "1";
        img.src = PROXY_URL + "/api/images/proxy/" + token + ".webp";
    }

    function safeDate(value) {
        if (value === null || value === undefined || value === "") return null;

        const n = Number(value);
        if (!Number.isFinite(n) || n <= 0) return null;

        const d = new Date(n);
        return Number.isNaN(d.getTime()) ? null : d;
    }

    function isToday(date) {
        if (!date) return false;

        const now = new Date();
        return date.getFullYear() === now.getFullYear() &&
               date.getMonth() === now.getMonth() &&
               date.getDate() === now.getDate();
    }

    function isLive(match) {
        return match?.live === true ||
               String(match?.status || "").toLowerCase() === "live";
    }

    function isChannel(match) {
        return !match?.teams?.home || !match?.teams?.away;
    }

    async function fetchJson(url, timeoutMs = 12000) {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), timeoutMs);

        try {
            const response = await fetch(url, {
                method: "GET",
                headers: { "Accept": "application/json" },
                signal: controller.signal
            });

            if (!response.ok) {
                throw new Error(`HTTP ${response.status}`);
            }

            return await response.json();
        } finally {
            clearTimeout(timer);
        }
    }

    async function loadMatches() {
        if (loading) return;

        loading = true;
        const app = document.getElementById("matches-container") ||
                    document.getElementById("app");

        if (app) {
            app.innerHTML = `
                <div class="loading-state">
                    <div class="loading-spinner"></div>
                    <p>Loading matches...</p>
                </div>`;
        }

        try {
            const data = await fetchJson(
                PROXY_URL + "/api/matches/all-today"
            );

            const rawMatches = Array.isArray(data)
                ? data
                : Array.isArray(data?.matches)
                    ? data.matches
                    : [];

            const matches = rawMatches.map(match => {
                const title = String(match.title || "Untitled Match");
                const parts = title.split(/\\s+vs\\.?\\s+/i);
                return {
                    ...match,
                    id: String(match.id || ""),
                    date: match.startTime ? new Date(match.startTime).getTime() : null,
                    live: String(match.status || "").toLowerCase() === "live",
                    teams: match.teams || (parts.length >= 2 ? {
                        home: { name: parts[0].trim() },
                        away: { name: parts.slice(1).join(" vs ").trim() }
                    } : null)
                };
            });

            if (!matches.length) {
                if (app) app.innerHTML = `<div class="empty-state">No matches available.</div>`;
                return;
            }

            renderMatches(matches);

        } catch (error) {
            console.error("Match API error:", error);

            if (app) {
                app.innerHTML = `
                    <div class="error-state">
                        <h3>Unable to load matches</h3>
                        <p>${esc(error.name === "AbortError"
                            ? "The request timed out."
                            : error.message)}</p>
                        <button type="button" onclick="loadMatches()">Retry</button>
                    </div>`;
            }
        } finally {
            loading = false;
        }
    }

    function renderMatches(matches) {
        const groups = Object.fromEntries(
            CATEGORY_ORDER.map(category => [category, []])
        );

        for (const match of matches) {
            if (!match || typeof match !== "object") continue;

            const date = safeDate(match.date ?? match.timestamp);

            if (isLive(match)) {
                groups.LIVE.push(match);
                continue;
            }

            if (isToday(date)) {
                groups["TODAYS MATCHES"].push(match);
                continue;
            }

            const category = normalizeCategory(match.category);
            (groups[category] || groups.OTHER).push(match);
        }
        window.__SPORTZFY_MATCHES = new Map(
            matches.filter(Boolean).map(match => [String(match.id || ""), match])
        );


        const container = document.getElementById("matches-container") ||
                          document.getElementById("app");

        let output = "";

        for (const category of CATEGORY_ORDER) {
            const list = groups[category];
            if (!list.length) continue;

            const sectionId = "category-" + category.toLowerCase().replace(/[^a-z0-9]+/g, "-");
            output += `
                <section class="category-section" data-carousel-category="${esc(category)}">
                    <div class="category-heading-row">
                        <h2>${esc(category)}</h2>
                        <div class="category-controls" aria-label="${esc(category)} navigation">
                            <button type="button" class="category-arrow" data-carousel-prev="${sectionId}" aria-label="Previous ${esc(category)} matches">‹</button>
                            <button type="button" class="category-arrow" data-carousel-next="${sectionId}" aria-label="Next ${esc(category)} matches">›</button>
                        </div>
                    </div>
                    <div class="category-viewport" id="${sectionId}">
                        <div class="matches-grid category-track">
                            ${list.map(buildMatchCard).join("")}
                        </div>
                    </div>
                    <div class="category-progress" aria-hidden="true"><span></span></div>
                </section>`;
        }

        requestAnimationFrame(initCategoryCarousels);

        container.innerHTML = output ||
            `<div class="empty-state">No matches available.</div>`;
    }

    function buildMatchCard(match) {
        const id = String(match.id || "");

        if (isChannel(match)) {
            const poster = resolveAssetUrl(match.poster);

            return `
                <article class="match-card channel-card">
                    ${poster
                        ? `<img class="channel-poster" src="${esc(poster)}" alt="${esc(match.title || "Channel")}" loading="lazy">`
                        : `<div class="channel-poster placeholder">TV</div>`}
                    <div class="match-title">${esc(match.title || "Channel")}</div>
                    ${match.popular ? `<span class="popular-badge">POPULAR</span>` : ""}
                    <button type="button" class="watch-btn" data-match-id="${esc(id)}">Watch Stream</button>
                </article>`;
        }

        const home = match.teams?.home || {};
        const away = match.teams?.away || {};
        const homeBadge = getLogoUrl(home.badge);
        const awayBadge = getLogoUrl(away.badge);
        const homeLogo = homeBadge
            ? `<img class="team-logo" src="${esc(homeBadge)}" data-logo-token="${esc(home.badge || "")}" onerror="logoError(this,this.dataset.logoToken)" alt="${esc(home.name || "Home")}" loading="lazy">`
            : `<div class="team-logo placeholder">?</div>`;
        const awayLogo = awayBadge
            ? `<img class="team-logo" src="${esc(awayBadge)}" data-logo-token="${esc(away.badge || "")}" onerror="logoError(this,this.dataset.logoToken)" alt="${esc(away.name || "Away")}" loading="lazy">`
            : `<div class="team-logo placeholder">?</div>`;

        const matchDate = safeDate(match.date ?? match.timestamp);
        const live = isLive(match);
        const statusText = live ? "Live now" : (matchDate ? matchDate.toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"}) : "Scheduled");

        return `
            <article class="match-card">
                <div class="match-title">${esc(match.title || `${home.name || "TBD"} vs ${away.name || "TBD"}`)}</div>
                <div class="teams">
                    <div class="team">${homeLogo}<div class="team-name">${esc(home.name || "TBD")}</div></div>
                    <div class="vs">VS</div>
                    <div class="team">${awayLogo}<div class="team-name">${esc(away.name || "TBD")}</div></div>
                </div>
                <div class="match-meta">
                    <span class="match-status ${live ? "live" : ""}">${statusText}</span>
                </div>
                <button type="button" class="watch-btn" data-match-id="${esc(id)}">${live ? "Watch Live" : "Watch Stream"}</button>
            </article>`;
    }

    /*
     * MANUAL STREAMS ONLY
     *
     * Nothing is fetched from a stream-source API.
     * The match/channel names come from /api/matches/all-today.
     * Add your own playable URLs here.
     *
     * Supported format:
     *
     * "admin-tennis-channel": [
     *   { name: "Stream 1", quality: "HD", language: "English", url: "YOUR_URL" },
     *   { name: "Stream 2", quality: "SD", language: "English", url: "YOUR_URL" }
     * ]
     */
    const MANUAL_STREAMS = {};

    let activeMatch = null;

    function getManualStreams(matchId) {
        const match = window.__SPORTZFY_MATCHES?.get(String(matchId));
        const configured = MANUAL_STREAMS[String(matchId)];

        if (Array.isArray(configured)) return configured;
        if (configured && typeof configured === "object" && configured.url) return [configured];

        if (Array.isArray(match?.channels)) {
            return match.channels
                .filter(channel => channel && channel.url)
                .map(channel => ({
                    name: channel.name || "Stream",
                    quality: channel.quality || "HD",
                    language: channel.language || channel.genre || "Sports",
                    url: channel.url
                }));
        }

        return [];
    }

    function openManualStream(matchId) {
        const match = window.__SPORTZFY_MATCHES?.get(String(matchId));
        if (!match) return;

        activeMatch = match;

        const modal = document.getElementById("stream-modal");
        const picker = document.getElementById("stream-picker");
        const player = document.getElementById("player-container");

        if (!modal || !picker || !player) return;

        const streams = getManualStreams(matchId);
        const title = match.title || "Channel";
        const count = streams.length;

        document.getElementById("stream-subtitle").textContent =
            `${title} • ${count} stream${count === 1 ? "" : "s"} available`;

        player.hidden = true;
        player.replaceChildren();

        if (!count) {
            picker.innerHTML = `
                <div class="stream-source-box">
                    <div class="source-head">
                        <div>
                            <div class="source-name">Admin</div>
                            <div class="source-note">✣ Admin added streams</div>
                        </div>
                        <div class="stream-count">0 streams</div>
                    </div>
                    <div class="no-manual-streams">
                        <strong>${esc(title)}</strong>
                        No manual streams have been added yet.
                    </div>
                </div>`;
        } else {
            picker.innerHTML = `
                <div class="stream-source-box">
                    <div class="source-head">
                        <div>
                            <div class="source-name">Admin</div>
                            <div class="source-note">✣ Admin added streams</div>
                        </div>
                        <div class="stream-count">${count} stream${count === 1 ? "" : "s"}</div>
                    </div>
                    <div class="stream-list">
                        ${streams.map((stream, index) => `
                            <button class="stream-option ${index === 0 ? "current" : ""}"
                                    type="button"
                                    data-stream-index="${index}">
                                <span class="quality-pill">${esc(stream.quality || "SD")}</span>
                                <span class="stream-label">${esc(stream.name || `Stream ${index + 1}`)}</span>
                                ${index === 0 ? `<span class="current-label">✓ Current</span>` : ""}
                                <span class="stream-meta">
                                    <span>◉ ${esc(stream.language || "English")}</span>
                                </span>
                            </button>
                        `).join("")}
                    </div>
                </div>`;
        }

        modal.style.display = "flex";
        document.body.style.overflow = "hidden";
    }

    function playManualStream(index) {
        if (!activeMatch) return;

        const streams = getManualStreams(activeMatch.id);
        const stream = streams[index];
        if (!stream?.url) return;

        const picker = document.getElementById("stream-picker");
        const player = document.getElementById("player-container");
        if (!picker || !player) return;

        const iframe = document.createElement("iframe");
        iframe.src = stream.url;
        iframe.allowFullscreen = true;
        iframe.setAttribute("allow", "autoplay; fullscreen; picture-in-picture");
        iframe.setAttribute("referrerpolicy", "no-referrer-when-downgrade");
        iframe.frameBorder = "0";

        player.hidden = false;
        player.replaceChildren(iframe);

        picker.querySelectorAll(".stream-option").forEach((button, i) => {
            button.classList.toggle("current", i === Number(index));
            const current = button.querySelector(".current-label");
            if (i === Number(index)) {
                if (!current) {
                    const label = document.createElement("span");
                    label.className = "current-label";
                    label.textContent = "✓ Current";
                    button.insertBefore(label, button.querySelector(".stream-meta"));
                }
            } else if (current) {
                current.remove();
            }
        });
    }

    function toggleTheaterMode() {
        document.querySelector(".stream-page")?.classList.toggle("theater");
    }

    async function copyEmbedCode() {
        if (!activeMatch) return;
        const url = location.href.split("#")[0] + "#match=" + encodeURIComponent(activeMatch.id);
        try {
            await navigator.clipboard.writeText(`<iframe src="${url}" width="100%" height="500" frameborder="0" allowfullscreen></iframe>`);
        } catch (_) {}
    }

    function closeModal() {
        const modal = document.getElementById("stream-modal");
        const player = document.getElementById("player-container");

        if (modal) modal.style.display = "none";
        if (player) {
            player.hidden = true;
            player.replaceChildren();
        }
        document.querySelector(".stream-page")?.classList.remove("theater");
        document.body.style.overflow = "";
        activeMatch = null;
    }

    document.addEventListener("click", event => {
        const matchButton = event.target.closest("[data-match-id]");
        if (matchButton && !matchButton.disabled) {
            openManualStream(matchButton.dataset.matchId);
            return;
        }

        const streamButton = event.target.closest("[data-stream-index]");
        if (streamButton) {
            playManualStream(Number(streamButton.dataset.streamIndex));
            return;
        }

        const modal = document.getElementById("stream-modal");
        if (modal && event.target === modal) closeModal();
    });

    document.addEventListener("keydown", event => {
        if (event.key === "Escape") closeModal();
    });

    document.addEventListener("DOMContentLoaded", loadMatches);
</script>
<script>
function initCategoryCarousels(){
    document.querySelectorAll("[data-carousel-category]").forEach(section=>{
        const viewport=section.querySelector(".category-viewport");
        const track=section.querySelector(".category-track");
        const prev=section.querySelector("[data-carousel-prev]");
        const next=section.querySelector("[data-carousel-next]");
        const progress=section.querySelector(".category-progress span");
        if(!viewport||!track||!prev||!next)return;

        let page=0;
        const getVisible=()=>window.innerWidth<=380?1:(window.innerWidth<=900?2:3);
        const maxPage=()=>Math.max(0,Math.ceil(track.children.length/getVisible())-1);
        const update=()=>{
            const visible=getVisible();
            const gap=parseFloat(getComputedStyle(track).columnGap)||16;
            const cardWidth=track.children[0]?.getBoundingClientRect().width||viewport.clientWidth;
            page=Math.min(page,maxPage());
            track.style.transform=`translateX(-${page*(cardWidth+gap)*visible}px)`;
            prev.disabled=page===0;
            next.disabled=page>=maxPage();
            if(progress){
                const pages=maxPage()+1;
                progress.style.width=`${100/pages}%`;
                progress.style.transform=`translateX(${page*100}%)`;
            }
        };
        prev.addEventListener("click",()=>{page=Math.max(0,page-1);update()});
        next.addEventListener("click",()=>{page=Math.min(maxPage(),page+1);update()});

        let startX=0,startY=0;
        viewport.addEventListener("touchstart",e=>{
            const t=e.changedTouches[0]; startX=t.clientX; startY=t.clientY;
        },{passive:true});
        viewport.addEventListener("touchend",e=>{
            const t=e.changedTouches[0],dx=t.clientX-startX,dy=t.clientY-startY;
            if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy)*1.2){
                if(dx<0&&page<maxPage())page++;
                if(dx>0&&page>0)page--;
                update();
            }
        },{passive:true});
        window.addEventListener("resize",update);
        update();
    });
}
</script>
<script>
(function(){
  const sidebar=document.getElementById("sfy-sidebar");
  const overlay=document.getElementById("sfy-overlay");
  const menu=document.getElementById("sfy-mobile-menu");
  const search=document.getElementById("sfy-search-input");
  function closeMenu(){sidebar?.classList.remove("open");overlay?.classList.remove("show")}
  menu?.addEventListener("click",()=>{sidebar?.classList.toggle("open");overlay?.classList.toggle("show")});
  overlay?.addEventListener("click",closeMenu);

  function normalizeNav(v){
    return String(v||"").trim().toUpperCase();
  }
  function filterSections(category){
    const wanted=normalizeNav(category);
    document.querySelectorAll(".category-section").forEach(section=>{
      const title=normalizeNav(section.querySelector("h2")?.textContent);
      section.style.display=(wanted==="ALL"||title===wanted)?"":"none";
    });
    document.querySelectorAll("[data-nav]").forEach(btn=>btn.classList.toggle("active",normalizeNav(btn.dataset.nav)===wanted));
    if(wanted!=="ALL"){
      const section=[...document.querySelectorAll(".category-section")].find(s=>normalizeNav(s.querySelector("h2")?.textContent)===wanted);
      section?.scrollIntoView({behavior:"smooth",block:"start"});
    }else window.scrollTo({top:0,behavior:"smooth"});
    closeMenu();
  }
  document.addEventListener("click",e=>{
    const nav=e.target.closest("[data-nav]");
    if(nav){e.preventDefault();filterSections(nav.dataset.nav)}
  });

  search?.addEventListener("input",()=>{
    const q=search.value.trim().toLowerCase();
    document.querySelectorAll(".category-section").forEach(section=>{
      let visible=0;
      section.querySelectorAll(".match-card").forEach(card=>{
        const ok=!q||card.textContent.toLowerCase().includes(q);
        card.style.display=ok?"":"none";
        if(ok)visible++;
      });
      section.style.display=visible?"":"none";
    });
    if(q) document.querySelectorAll("[data-nav]").forEach(btn=>btn.classList.remove("active"));
  });
  document.addEventListener("keydown",e=>{
    if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="k"){e.preventDefault();search?.focus()}
    if(e.key==="Escape"&&document.activeElement===search){search.value="";search.dispatchEvent(new Event("input"))}
  });

  window.renderSportzfyHero=function(matches){
    const hero=document.getElementById("sfy-hero");
    if(!hero||!Array.isArray(matches)||!matches.length)return;
    const match=matches.find(m=>m?.live)||matches.find(m=>m?.teams?.home&&m?.teams?.away)||matches[0];
    if(!match)return;
    const home=match.teams?.home||{},away=match.teams?.away||{};
    const escHero=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
    const logo=t=>t?.badge?getLogoUrl(t.badge):"";
    const date=match.date?new Date(match.date):null;
    hero.hidden=false;
    hero.innerHTML=
      '<div class="sfy-hero-content">'+
      '<div class="sfy-hero-kicker">'+(match.live?"LIVE NOW":"FEATURED MATCH")+'</div>'+
      '<div class="sfy-hero-title">'+escHero(match.title||"Featured Match")+'</div>'+
      '<div class="sfy-hero-teams">'+
      '<div class="sfy-hero-team">'+(logo(home)?'<img src="'+escHero(logo(home))+'" alt="">':"")+escHero(home.name||"TBD")+'</div>'+
      '<div class="sfy-hero-vs">VS</div>'+
      '<div class="sfy-hero-team">'+(logo(away)?'<img src="'+escHero(logo(away))+'" alt="">':"")+escHero(away.name||"TBD")+'</div>'+
      '</div>'+
      '<div class="sfy-hero-meta">'+(date?date.toLocaleString([], {weekday:"short",day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}):"Schedule available")+'</div>'+
      '<button class="sfy-hero-btn" type="button" data-match-id="'+escHero(match.id)+'"><i class="fas fa-play"></i> '+(match.live?"Watch Live":"View Match")+'</button>'+
      '</div>';
  };
})();
</script>
</body>
