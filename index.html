<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sportzfylive - Live Sports</title>
  
  <!-- Font Awesome for icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

  <!-- ================= CSS ================= -->
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #121212;
      color: #ffffff;
      padding: 20px;
    }

    /* Header Styles */
    .main-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      padding-bottom: 15px;
      border-bottom: 2px solid #2a2a2a;
    }

    .main-header h1 {
      font-size: 24px;
      color: #00d2ff;
    }

    #refresh-btn {
      background: #2a2a2a;
      color: #fff;
      border: 1px solid #444;
      padding: 8px 16px;
      border-radius: 5px;
      cursor: pointer;
      transition: 0.3s;
    }

    #refresh-btn:hover {
      background: #444;
    }

    /* Category Sections */
    .category-section {
      margin-bottom: 40px;
    }

    .category-title {
      font-size: 18px;
      color: #00d2ff;
      margin-bottom: 15px;
      text-transform: uppercase;
      letter-spacing: 1px;
      border-left: 4px solid #00d2ff;
      padding-left: 10px;
    }

    /* Match Grid */
    .matches-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }

    /* Match Card */
    .match-card {
      background: #1e1e1e;
      border-radius: 10px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
      transition: transform 0.2s;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .match-card:hover {
      transform: translateY(-5px);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .badge-live { color: #ff4444; }
    .badge-upcoming { color: #888; }

    .teams-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      min-height: 80px; /* Prevents layout shift */
    }

    .team {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* Fixed Logo Styling */
    .team-logo {
      width: 50px;
      height: 50px;
      object-fit: contain;
      margin-bottom: 8px;
      background: rgba(255, 255, 255, 0.05); /* Subtle background for transparent logos */
      border-radius: 50%;
      padding: 5px;
    }

    .fallback-logo {
      width: 50px;
      height: 50px;
      background: #2a2a2a;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: bold;
      color: #00d2ff;
      margin-bottom: 8px;
      border: 1px solid #444;
    }

    .team-name {
      font-size: 12px;
      font-weight: 600;
      max-width: 100px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .vs-text {
      font-weight: bold;
      color: #555;
      margin: 0 10px;
    }

    .match-date {
      font-size: 12px;
      color: #aaa;
      margin-bottom: 15px;
    }

    /* Buttons */
    .btn {
      display: block;
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 5px;
      font-weight: bold;
      cursor: pointer;
      text-decoration: none;
      transition: 0.3s;
    }

    .btn-watch {
      background: #00d2ff;
      color: #000;
    }

    .btn-watch:hover {
      background: #00a8cc;
    }

    .btn-disabled {
      background: #2a2a2a;
      color: #666;
      cursor: not-allowed;
    }

    /* Modal Styles */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.95);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      width: 90%;
      max-width: 900px;
      background: #000;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 0 20px rgba(0, 210, 255, 0.3);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px;
      background: #1e1e1e;
      border-bottom: 1px solid #333;
    }

    .close-btn {
      background: transparent;
      color: #ff4444;
      border: none;
      font-size: 24px;
      cursor: pointer;
    }

    .player-container {
      width: 100%;
      height: 500px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      background: #000;
    }

    .player-container iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Loading Spinner */
    .loading-spinner {
      text-align: center;
      font-size: 18px;
      color: #00d2ff;
      margin-top: 50px;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="main-header">
    <h1>⚡ Sportzfylive</h1>
    <button id="refresh-btn" onclick="loadMatches()">
      <i class="fas fa-sync-alt"></i> Refresh
    </button>
  </header>

  <!-- Main Container for Matches -->
  <main id="matches-container">
    <div class="loading-spinner">Loading matches...</div>
  </main>

  <!-- Stream Modal (Hidden by default) -->
  <div id="stream-modal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modal-title">Live Stream</h3>
        <button class="close-btn" onclick="closeModal()">&times;</button>
      </div>
      <div id="player-container" class="player-container">
        <!-- Stream iframe will be injected here -->
      </div>
    </div>
  </div>

  <!-- ================= JAVASCRIPT ================= -->
  <script>
    // ==========================================
    // CONFIGURATION
    // ==========================================
    // ⚠️ REPLACE THIS WITH YOUR CLOUDFLARE WORKER URL ⚠️
    const PROXY_URL = 'https://streamedproxy.svimranmy.workers.dev/L'; 

    // Define the exact order of categories you want
    const CATEGORY_ORDER = [
      'LIVE',
      'TODAY\'S MATCHES',
      'FOOTBALL',
      'AMERICAN FOOTBALL',
      'BASKETBALL',
      'CRICKET',
      'BASEBALL',
      'RUGBY',
      'TENNIS',
      'MOTOR-SPORTS',
      'GOLF',
      'FIGHT',
      'OTHER'
    ];

    // ==========================================
    // 1. FETCH MATCHES
    // ==========================================
    async function loadMatches() {
      const container = document.getElementById('matches-container');
      container.innerHTML = '<div class="loading-spinner">Loading matches...</div>';

      try {
        const response = await fetch(`${PROXY_URL}/api/matches/all-today`);
        
        if (!response.ok) throw new Error("Failed to fetch matches");
        
        const matches = await response.json();
        renderMatches(matches);

      } catch (error) {
        console.error("Error loading matches:", error);
        container.innerHTML = `<div class="loading-spinner" style="color: #ff4444;">Error loading matches. Please try again later.</div>`;
      }
    }

    // ==========================================
    // 2. HELPER: FIX BROKEN LOGOS
    // ==========================================
    function getLogoHtml(badgeUrl, teamName) {
      let finalUrl = badgeUrl;
      
      // If the API gives us a relative URL (e.g., "/logos/team.png"), prepend the domain
      if (finalUrl && !finalUrl.startsWith('http')) {
        finalUrl = `https://streamed.pk${finalUrl.startsWith('/') ? '' : '/'}${finalUrl}`;
      }

      // If we have a valid URL, use an image tag with an error fallback
      if (finalUrl) {
        return `
          <img src="${finalUrl}" 
               alt="${teamName}" 
               class="team-logo" 
               onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
          <div class="fallback-logo" style="display: none;">${teamName.charAt(0)}</div>
        `;
      }
      
      // If no URL at all, just use the fallback
      return `<div class="fallback-logo">${teamName.charAt(0)}</div>`;
    }

    // ==========================================
    // 3. RENDER MATCHES WITH CUSTOM SORTING
    // ==========================================
    function renderMatches(matches) {
      const container = document.getElementById('matches-container');
      container.innerHTML = '';

      if (!matches || matches.length === 0) {
        container.innerHTML = '<div class="loading-spinner">No matches available today.</div>';
        return;
      }

      // Initialize grouped object with our custom order
      const grouped = {};
      CATEGORY_ORDER.forEach(cat => grouped[cat] = []);

      const todayStr = new Date().toDateString();

      matches.forEach(match => {
        const isLive = match.status === 'live' || match.live === true;
        const matchDate = new Date(match.date);
        const isToday = matchDate.toDateString() === todayStr;

        if (isLive) {
          grouped['LIVE'].push(match);
        } else if (isToday) {
          grouped['TODAY\'S MATCHES'].push(match);
        } else {
          const cat = match.category ? match.category.toUpperCase() : 'OTHER';
          if (grouped[cat]) {
            grouped[cat].push(match);
          } else {
            grouped['OTHER'].push(match);
          }
        }
      });

      // Loop through our custom order and render only the categories that have matches
      for (const category of CATEGORY_ORDER) {
        const categoryMatches = grouped[category];
        
        if (categoryMatches.length === 0) continue; // Skip empty categories

        let sectionHtml = `
          <div class="category-section">
            <h2 class="category-title">${category}</h2>
            <div class="matches-grid">
        `;

        categoryMatches.forEach(match => {
          const matchDate = new Date(match.date).toLocaleString('en-US', {
            month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
          });

          const isLive = match.status === 'live' || match.live === true;
          const statusBadge = isLive 
            ? '<span class="badge-live">● LIVE</span>' 
            : '<span class="badge-upcoming">UPCOMING</span>';

          // Use our new logo helper
          const homeLogo = getLogoHtml(match.teams.home.badge, match.teams.home.name);
          const awayLogo = getLogoHtml(match.teams.away.badge, match.teams.away.name);

          let buttonHtml = '';
          
          if (match.sources && match.sources.length > 0) {
            buttonHtml = `<button class="btn btn-watch" onclick="loadStreamedStream('${match.sources[0].source}', '${match.sources[0].id}')">Watch Stream</button>`;
          } else {
            buttonHtml = `<button class="btn btn-disabled" disabled>No Stream</button>`;
          }

          sectionHtml += `
            <div class="match-card">
              <div class="card-header">
                <span>${match.category ? match.category.toUpperCase() : 'SPORT'}</span>
                ${statusBadge}
              </div>
              
              <div class="teams-container">
                <div class="team">
                  ${homeLogo}
                  <div class="team-name">${match.teams.home.name}</div>
                </div>
                <div class="vs-text">VS</div>
                <div class="team">
                  ${awayLogo}
                  <div class="team-name">${match.teams.away.name}</div>
                </div>
              </div>
              
              <div class="match-date">${matchDate}</div>
              ${buttonHtml}
            </div>
          `;
        });

        sectionHtml += `</div></div>`;
        container.innerHTML += sectionHtml;
      }
    }

    // ==========================================
    // 4. FETCH AND PLAY THE STREAM API
    // ==========================================
    async function loadStreamedStream(sourceName, sourceId) {
      const modal = document.getElementById('stream-modal');
      const playerContainer = document.getElementById('player-container');
      const modalTitle = document.getElementById('modal-title');

      modal.style.display = 'flex';
      modalTitle.innerText = 'Loading Stream...';
      playerContainer.innerHTML = '<div class="loading-spinner">Connecting to stream...</div>';

      try {
        const response = await fetch(`${PROXY_URL}/api/stream/${sourceName}/${sourceId}`);
        
        if (!response.ok) throw new Error("Stream API failed");
        
        const streamData = await response.json();

        const streamUrl = streamData.url || streamData.embed || streamData.stream;

        if (!streamUrl) {
          throw new Error("No stream URL found in the API response.");
        }

        modalTitle.innerText = 'Live Stream';

        if (streamUrl.includes('<iframe')) {
          playerContainer.innerHTML = streamUrl;
        } else {
          playerContainer.innerHTML = `
            <iframe src="${streamUrl}" allowfullscreen="true" scrolling="no" frameborder="0"></iframe>
          `;
        }

      } catch (error) {
        console.error("Stream Error:", error);
        modalTitle.innerText = 'Error';
        playerContainer.innerHTML = `
          <div style="text-align: center; color: #ff4444;">
            <p>Sorry, this stream is currently unavailable.</p>
            <p style="font-size: 12px; color: #888; margin-top: 10px;">Error: ${error.message}</p>
          </div>
        `;
      }
    }

    // ==========================================
    // 5. MODAL CONTROLS
    // ==========================================
    function closeModal() {
      const modal = document.getElementById('stream-modal');
      const playerContainer = document.getElementById('player-container');
      
      modal.style.display = 'none';
      playerContainer.innerHTML = ''; 
    }

    window.onclick = function(event) {
      const modal = document.getElementById('stream-modal');
      if (event.target === modal) {
        closeModal();
      }
    }

    // ==========================================
    // 6. INITIALIZE
    // ==========================================
    window.addEventListener('DOMContentLoaded', loadMatches);
  </script>
</body>
</html>
