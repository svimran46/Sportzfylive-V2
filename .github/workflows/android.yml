name: Android

on:
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & unit test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble debug and run unit + Robolectric UI tests
        run: ./gradlew --no-configuration-cache assembleDebug testDebugUnitTest
      - name: Assemble shrunk release (R8 + lint vital)
        # Signed with the SPORTZFY_* keystore when those secrets exist,
        # otherwise with the debug key so the APK can still be installed.
        run: |
          if [ -n "$SPORTZFY_KEYSTORE_BASE64" ]; then
            echo "$SPORTZFY_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            export SPORTZFY_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          fi
          ./gradlew --no-configuration-cache assembleRelease
        env:
          SPORTZFY_KEYSTORE_BASE64: ${{ secrets.SPORTZFY_KEYSTORE_BASE64 }}
          SPORTZFY_KEYSTORE_PASSWORD: ${{ secrets.SPORTZFY_KEYSTORE_PASSWORD }}
          SPORTZFY_KEY_ALIAS: ${{ secrets.SPORTZFY_KEY_ALIAS }}
          SPORTZFY_KEY_PASSWORD: ${{ secrets.SPORTZFY_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: sportzfy-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: sportzfy-release-apk
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: android/app/build/reports/
          if-no-files-found: ignore
